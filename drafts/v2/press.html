// ------------------------------------------------------------ vec helpers ---
const v3 = (x,y,z)=>[x,y,z];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const len=a=>Math.hypot(a[0],a[1],a[2]), norm=a=>mul(a,1/(len(a)||1));
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const lerp=(a,b,t)=>add(a,mul(sub(b,a),t));
const mix=(a,b,t)=>a+(b-a)*t;
// two-bone IK: root a, target c, bone lengths, pole hint -> joint
function ik(a, c, l1, l2, pole){
  let ac=sub(c,a), d=len(ac); const dir=norm(ac);
  d=Math.min(d, l1+l2-1e-4);
  const x=(l1*l1-l2*l2+d*d)/(2*d), h=Math.sqrt(Math.max(0,l1*l1-x*x));
  const pv=norm(sub(pole, mul(dir, dot(pole,dir))));
  return add(a, add(mul(dir,x), mul(pv,h)));
}
// frame from axis T (local y) and a hint for local z
function frame(T, zHint){ const Y=norm(T); const X=norm(cross(Y,zHint)); const Z=cross(X,Y); return [X,Y,Z]; }
const m3=(X,Y,Z)=>[...X,...Y,...Z]; // column-major for GLSL mat3(X,Y,Z)

function spring(t, period, amp, decay, freq){ const tt=((t%period)+period)%period; return amp*Math.exp(-decay*tt)*Math.sin(freq*tt); }

function uniformDecls(P){
  return Object.entries(P).filter(([k])=>k[0]!=='_').map(([k,v])=> typeof v==='number'?`uniform float ${k};`: v.length===9?`uniform mat3 ${k};`:`uniform vec3 ${k};`).join('\n');

const FRAG_BODY = `
#define M_FLOOR 1.
#define M_WALL 2.
#define M_WOOD 3.
#define M_SHEET 4.
#define M_HER 5.
#define M_LEG 6.

float sdEll(vec3 p, vec3 r){ float k0=length(p/r); float k1=length(p/(r*r)); return k0*(k0-1.0)/max(k1,1e-6); }
float sdRC(vec3 p, vec3 a, vec3 b, float r1, float r2){
  vec3 ba=b-a; float l2=dot(ba,ba); float rr=r1-r2; float a2=l2-rr*rr; float il2=1.0/l2;
  vec3 pa=p-a; float y=dot(pa,ba); float z=y-l2;
  vec3 xv=pa*l2-ba*y; float x2=dot(xv,xv); float y2=y*y*l2; float z2=z*z*l2;
  float k=sign(rr)*rr*rr*x2;
  if(sign(z)*a2*z2>k) return sqrt(x2+z2)*il2-r2;
  if(sign(y)*a2*y2<k) return sqrt(x2+y2)*il2-r1;
  return (sqrt(x2*a2*il2)+y*rr)*il2-r1;
}
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float sdRBox(vec3 p, vec3 b, float r){ vec3 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r; }
float smin(float a,float b,float k){ float h=max(k-abs(a-b),0.)/k; return min(a,b)-h*h*k*0.25; }
float smax(float a,float b,float k){ return -smin(-a,-b,k); }
vec2 U2(vec2 a, vec2 b){ return a.x<b.x?a:b; }
vec2 S2(vec2 a, vec2 b, float k){ return vec2(smin(a.x,b.x,k), a.x<b.x?a.y:b.y); }
// ellipsoid oriented along a segment (long axis a->b), flattened with 'flat' toward hint
float sdEllSeg(vec3 p, vec3 a, vec3 b, float rw, float rd, vec3 hint){
  vec3 Y=normalize(b-a); vec3 X=normalize(cross(Y,hint)); vec3 Z=cross(X,Y);
  vec3 q=p-(a+b)*0.5; return sdEll(vec3(dot(q,X),dot(q,Y),dot(q,Z)), vec3(rw, length(b-a)*0.5, rd));
}

  return normalize(k.xyy*map(p+k.xyy*e)+k.yyx*map(p+k.yyx*e)+k.yxy*map(p+k.yxy*e)+k.xxx*map(p+k.xxx*e)); }
float calcAO(vec3 p, vec3 n){ float occ=0., sca=1.;
  for(int i=0;i<5;i++){ float h=0.008+0.035*float(i); float d=map(p+h*n); occ+=(h-d)*sca; sca*=0.8; }
  return clamp(1.-2.6*occ,0.,1.); }
float shadow(vec3 ro, vec3 rd){ float res=1., t=0.015;
  for(int i=0;i<40;i++){ float h=map(ro+rd*t); res=min(res, 9.*h/t); t+=clamp(h,0.01,0.15); if(res<0.02||t>2.5) break; }
  return clamp(res,0.,1.); }

void main(){
  vec2 uv=(gl_FragCoord.xy/uRes)*2.-1.; uv.x*=uRes.x/uRes.y;
  vec3 rd=normalize(uCamF + uv.x*uTan*uCamR + uv.y*uTan*uCamU);
  vec3 ro=uCamP;
  float t=0.05; vec2 h=vec2(0.); bool hit=false;
  for(int i=0;i<160;i++){ vec3 p=ro+rd*t; h=mapAll(p); if(h.x<0.0004*t){hit=true;break;} t+=h.x*0.9; if(t>7.) break; }
  if(!hit){ o0=vec4(0.,t,0.,0.); o1=vec4(0.); o2=vec4(0.); return; }
  vec3 p=ro+rd*t; vec3 n=calcN(p);
  float mat=h.y;
  // stockings: thigh-highs, lace band, bare skin near the ass
  if(mat==M_LEG){
    vec3 hip=p.x<0.?hHipL:hHipR, kn=p.x<0.?hKneeL:hKneeR;
    float s=dot(p-hip, normalize(kn-hip))/length(kn-hip);
    mat = s<0.30 ? M_HER : (s<0.37 ? 16. : 6.);
  }
  vec3 L=normalize(vec3(-0.45,0.85,0.55));
  float key=max(dot(n,L),0.);
  float sh = key>0.? shadow(p+n*0.004, L) : 0.;
  float ao=calcAO(p,n);
  vec3 hv=normalize(L-rd);
  float spec=pow(max(dot(n,hv),0.),48.)*sh;
  float rim=pow(1.-max(dot(n,-rd),0.),3.)*max(dot(n,normalize(vec3(0.6,0.7,-0.6))),0.);
  // world-space aux for windows on the wall
  o0=vec4(mat, t, key*sh, ao);
  o1=vec4(n, max(dot(n,-rd),0.));
  o2=vec4(spec, rim, p.x, p.y);
}
`;

// helper the her() SDF references: start of her waist inside the pelvis
const FRAG_PRE = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform vec3 uCamP, uCamF, uCamR, uCamU; uniform float uTan;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1; layout(location=2) out vec4 o2;
`;

// --------------------------------------------------------------- WebGL ------
const glc=document.createElement('canvas'); const gl=glc.getContext('webgl2',{antialias:false,preserveDrawingBuffer:true});
gl.getExtension('EXT_color_buffer_float');
let prog=null, progKeys=null, fbo=null, texs=[], fbW=0, fbH=0;
function compile(P){
  const keys=Object.keys(P).filter(k=>k[0]!=='_').join(',');
  if(prog && keys===progKeys) return;
  const src = FRAG_PRE + uniformDecls(P) + `\nvec3 hl_dummy(){ return hV + transpose(transpose(hF))*vec3(0.,-0.11,-0.11); }\n` + FRAG_BODY;
  const vs=gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs,`#version 300 es\nvoid main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position=vec4(p*2.-1.,0.,1.); }`); gl.compileShader(vs);
  const fs=gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs,src); gl.compileShader(fs);
  if(!gl.getShaderParameter(fs,gl.COMPILE_STATUS)){ const log=gl.getShaderInfoLog(fs); console.error(log); throw new Error(log); }
  prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  progKeys=keys;
}
function ensureFB(w,h){
  if(fbo && fbW===w && fbH===h) return;
  fbo=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fbo); texs=[];
  for(let i=0;i<3;i++){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texStorage2D(gl.TEXTURE_2D,1,gl.RGBA32F,w,h); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0+i,gl.TEXTURE_2D,t,0); texs.push(t); }
  gl.drawBuffers([gl.COLOR_ATTACHMENT0,gl.COLOR_ATTACHMENT1,gl.COLOR_ATTACHMENT2]);
  fbW=w; fbH=h;
}
const CAMS={
  game:{p:[0,0.50,1.50], at:[0,0.37,-0.02], fov:46},
  side:{p:[2.4,0.45,0.0], at:[0,0.35,-0.05], fov:40},
  top:{p:[0.0,2.6,0.05], at:[0,0.3,-0.06], fov:40, up:[0,0,-1]},
  quarter:{p:[1.5,1.0,1.4], at:[0,0.35,-0.05], fov:40},
  close:{p:[0,0.55,0.95], at:[0,0.33,0.06], fov:40},
};
function gbuffer(P, w, h, camName){
  compile(P); ensureFB(w,h);
  gl.useProgram(prog); gl.bindFramebuffer(gl.FRAMEBUFFER,fbo); gl.viewport(0,0,w,h);
  const c=CAMS[camName]||CAMS.game; const F=norm(sub(c.at,c.p)); const R=norm(cross(F,c.up||[0,1,0])); const Up=cross(R,F);
  const u=(n,f,...a)=>{ const l=gl.getUniformLocation(prog,n); if(l) gl[f](l,...a); };
  u('uRes','uniform2f',w,h); u('uCamP','uniform3fv',c.p); u('uCamF','uniform3fv',F); u('uCamR','uniform3fv',R); u('uCamU','uniform3fv',Up);
  u('uTan','uniform1f',Math.tan(c.fov*Math.PI/360));
  for(const [k,v] of Object.entries(P)){ if(k[0]==='_') continue; if(typeof v==='number') u(k,'uniform1f',v); else if(v.length===9) u(k,'uniformMatrix3fv',false,v); else u(k,'uniform3fv',v); }
  gl.drawArrays(gl.TRIANGLES,0,3);
  const bufs=[];
  for(let i=0;i<3;i++){ gl.readBuffer(gl.COLOR_ATTACHMENT0+i); const b=new Float32Array(w*h*4); gl.readPixels(0,0,w,h,gl.RGBA,gl.FLOAT,b); bufs.push(flipY(b,w,h)); }
  return bufs;
}
function flipY(b,w,h){ const o=new Float32Array(b.length); for(let y=0;y<h;y++) o.set(b.subarray((h-1-y)*w*4,(h-y)*w*4), y*w*4); return o; }

// -------------------------------------------------------- palettes / ramps --
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgb2hsl(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn); h= mx===r?(g-b)/d+(g<b?6:0): mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; } return [h,s,l]; }
function hsl2rgb(h,s,l){ h=((h%360)+360)%360/360; if(s===0) return [l*255,l*255,l*255].map(Math.round);
  const q=l<0.5?l*(1+s):l+s-l*s, p=2*l-q; const f=t=>{ t=(t+1)%1; return t<1/6?p+(q-p)*6*t: t<1/2?q: t<2/3?p+(q-p)*(2/3-t)*6:p; };
  return [f(h+1/3),f(h),f(h-1/3)].map(v=>Math.round(v*255)); }
function toward(h,target,amt){ let d=((target-h+540)%360)-180; return h+Math.sign(d)*Math.min(Math.abs(d),amt); }
// port of pxl's shadeRamp: cool, saturated shadows -> warm, paler lights
function shadeRamp(base,n,o={}){ const [h,s0,l0]=rgb2hsl(...hex(base)); const shift=o.shift??24, spread=o.spread??0.56, sat=o.sat??1;
  return Array.from({length:n},(_,i)=>{ const t=n===1?0:i/(n-1)-0.5; const l=Math.max(0.04,Math.min(0.96,l0+t*spread));
    const hh=t<0?toward(h,250,shift*-t*2):toward(h,55,shift*t*2); const s=Math.max(0,Math.min(1,s0*sat*(t<0?1+0.15*-t*2:1-0.3*t*2)));
    return hsl2rgb(hh,s,l); }); }
const PALS={
  color:{ bgInk:'#140c1c',
    1:['#4a3550',{spread:0.30}], 2:['#4b3d73',{spread:0.30}], 3:['#8a5a3e',{spread:0.5}], 4:['#c9c4e0',{spread:0.42}],
    5:['#f0bf9f',{spread:0.46}], 6:['#f0bf9f',{spread:0.46}], 16:['#2b1b2b',{spread:0.2}], 7:['#e59a9e',{spread:0.42}], 8:['#d9677f',{spread:0.5}], 9:['#c46a7a',{spread:0.4}],
    10:['#b97d58',{spread:0.5}], 11:['#b0705a',{spread:0.5}], 12:['#3d2a24',{spread:0.32}], 13:['#a58fb6',{spread:0.4}], 14:['#d9707f',{spread:0.5}],
    net:'#241520', window0:'#0e1430', window1:'#1b2550', star:'#fff4c9', cloud:'#2c3768', ink:'#140c1c' },
  gray:{ bgInk:'#121212',
    1:['#4a4a4a',{spread:0.3}], 2:['#5a5a5a',{spread:0.25}], 3:['#8c8c8c',{spread:0.5}], 4:['#cdcdcd',{spread:0.4}],
    5:['#e2e2e2',{spread:0.42}], 6:['#e2e2e2',{spread:0.42}], 16:['#2a2a2a',{spread:0.2}], 7:['#e6b2bc',{spread:0.38}], 8:['#d9899a',{spread:0.5}], 9:['#c98595',{spread:0.4}],
    10:['#9c9c9c',{spread:0.5}], 11:['#949090',{spread:0.5}], 12:['#363636',{spread:0.3}], 13:['#9a9a9a',{spread:0.4}], 14:['#d9899a',{spread:0.5}],
    net:'#232323', window0:'#1c1c1c', window1:'#2a2a2a', star:'#f4f4f4', cloud:'#3c3c3c', ink:'#121212' },
};
function buildRamps(pal){ const R={}; for(const k in pal){ if(Array.isArray(pal[k])) R[k]=shadeRamp(pal[k][0],5,pal[k][1]); } return R; }

// ------------------------------------------------------- pixel post-pass ----
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+0.5)/16);
const isBody=m=>m>=5 && m!==13;
function post(bufs, w, h, opt){
  const [g0,g1,g2]=bufs; const pal=PALS[opt.pal]||PALS.gray; const ramps=buildRamps(pal);
  const N=w*h; const mat=new Uint8Array(N), dep=new Float32Array(N), lvl=new Int8Array(N), col=new Array(N);
  const nrm=new Float32Array(N*3); const dep2=new Float32Array(N);
  for(let i=0;i<N;i++){
    mat[i]=Math.round(g0[i*4]); dep[i]=g0[i*4+1];
    nrm[i*3]=g1[i*4]; nrm[i*3+1]=g1[i*4+1]; nrm[i*3+2]=g1[i*4+2];
    if(!mat[i]) continue;
    const key=g0[i*4+2], ao=g0[i*4+3], spec=g2[i*4], rim=g2[i*4+1];
    const ndl=g1[i*4]*-0.45/1.13+g1[i*4+1]*0.85/1.13+g1[i*4+2]*0.55/1.13, vdn=g1[i*4+3];
    // one light, wrapped; shadow + AO keep creases dark. no pillow shading.
    let s = 0.16 + 0.70*key + 0.14*Math.max(0,(ndl+0.35)/1.35);
    s *= mix(1, ao, 0.75);
    s += rim*0.35;
    if(opt.mode==='clay'){ lvl[i]=0; dep2[i]=0.18+0.62*vdn+0.25*key; continue; }
    const x=i%w, y=(i/w)|0;
    const nl=5;
    let v=s*(nl-0.35);
    const fr=v-Math.floor(v);
    // dither only in a thin band at tone boundaries
    let L=Math.floor(v); if(fr>0.82 && BAY[(y&3)*4+(x&3)]<(fr-0.82)/0.18) L++;
    L=Math.max(0,Math.min(nl-1,L));
    const m=mat[i];
    if(spec>0.45 && isBody(m) && m!==16) L=nl; // sweat/oil glint
    lvl[i]=L;
  }
  const out=new Uint8ClampedArray(N*4);
  const ink=hex(pal.ink);
  const get=(i)=>{ const m=mat[i]; const r=ramps[m]; if(!r) return [255,0,255]; const L=lvl[i]; if(L>=5) return [255,255,250]; return r[L]; };
  // depth-aware outlines: a pixel is an edge if a 4-neighbour is notably further away,
  // belongs to another body, or the surface folds sharply (crease). Edges take the
  // darkest ramp step of their own material (sel-out); against empty room = ink.
  const edge=new Uint8Array(N);
  const nb=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=y*w+x, m=mat[i]; if(!m) continue; const bodyA=isBody(m);
    for(const [dx,dy] of nb){ const X=x+dx, Y=y+dy; if(X<0||Y<0||X>=w||Y>=h) continue; const j=Y*w+X;
      const dz=dep[j]-dep[i];
      if(dz > 0.035*dep[i]+0.01){ edge[i]= (bodyA && !isBody(mat[j])) ? 2 : 1; break; }
      if(bodyA && isBody(mat[j])){
        const ca=m===10||m===12?1:m===11||m===14?2:(m>=5&&m<=9||m===16)?3:0, cb=mat[j]===10||mat[j]===12?1:mat[j]===11||mat[j]===14?2:3;
        if(ca!==cb && dz>0){ edge[i]=1; break; }
        const cd=nrm[i*3]*nrm[j*3]+nrm[i*3+1]*nrm[j*3+1]+nrm[i*3+2]*nrm[j*3+2];
        if(cd<0.55 && dz>0.0){ edge[i]=1; break; }
      }
    }
  }
  for(let i=0;i<N;i++){
    const x=i%w, y=(i/w)|0; let c;
    if(!mat[i]){ c=[0,0,0]; }
    else if(opt.mode==='clay'){ const s=Math.max(0,Math.min(1.1,dep2[i])); const m=mat[i]; const tint= (m>=10&&m<=12)||m===14 ? [150,175,230] : m===7||m===8||m===9 ? [255,140,160] : isBody(m) ? [250,215,190] : [120,120,120]; c=tint.map(v=>Math.min(255,v*s)); if(edge[i]) c=[25,22,28]; }
    else {
      c=get(i);
      if(mat[i]===2 && opt.windows){ const wc=opt.windows(i%w,(i/w)|0,g2[i*4+2],g2[i*4+3]); if(wc) c=wc; }
      if(mat[i]===6 && (((x+y)%5)===0 || ((x-y+500)%5)===0)) c=hex(pal.net);
      if(edge[i]) c = edge[i]===2 ? ink : (ramps[mat[i]]? ramps[mat[i]][0].map(v=>v*0.62) : ink);
    }
    out[i*4]=c[0]; out[i*4+1]=c[1]; out[i*4+2]=c[2]; out[i*4+3]=255;
  }
  if(opt.mode!=='clay') cleanup(out,w,h);
  return out;
}
// remove orphan pixels: a pixel whose 4 neighbours all share one other colour
function cleanup(o,w,h){
  const key=i=>(o[i*4]<<16)|(o[i*4+1]<<8)|o[i*4+2];
  const src=new Int32Array(w*h); for(let i=0;i<w*h;i++) src[i]=key(i);
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i=y*w+x; const a=src[i-1],b=src[i+1],c=src[i-w],d=src[i+w];
    if(a===b&&b===c&&c===d&&a!==src[i]){ o[i*4]=a>>16; o[i*4+1]=(a>>8)&255; o[i*4+2]=a&255; } }
}

// window pixels on the back wall: stars + clouds painted in wall space
function windowsFn(pal){
  return (sx,sy,wx,wy)=>{
    for(const cx of [-1.25,1.25]){
      const lx=wx-cx, ly=wy-0.82;
      if(Math.abs(lx)<0.38 && Math.abs(ly)<0.38){
        if(Math.abs(lx)>0.355||Math.abs(ly)>0.355||Math.abs(lx)<0.012) return hex(pal.ink==='#121212'?'#8c8c8c':'#a58fb6');
        const h=Math.sin(sx*12.9898+sy*78.233)*43758.5453; const r=h-Math.floor(h);
        const cloud = ly < -0.12 + 0.07*Math.sin(lx*9.0+cx) + 0.04*Math.sin(lx*23.0);
        if(cloud) return hex(r<0.5?pal.cloud:pal.window1);
        if(r>0.985) return hex(pal.star);
        return hex(ly>0.15?pal.window0:pal.window1);
      }
    }
    return null;
  };
}

// ------------------------------------------------------------- frame ------
const out=document.getElementById('out'), octx=out.getContext('2d');
function renderFrame(t, opt={}){
  opt=Object.assign({pal:'gray', mode:'pixel', cam:'game', w:320, h:180}, opt);
  const P=pose(t, opt);
  const bufs=gbuffer(P, opt.w, opt.h, opt.cam);
  opt.windows=windowsFn(PALS[opt.pal]||PALS.gray);
  const px=post(bufs, opt.w, opt.h, opt);
  out.width=opt.w; out.height=opt.h;
  octx.putImageData(new ImageData(px, opt.w, opt.h),0,0);
  return P;
}
window.renderFrame=renderFrame;
const q=new URLSearchParams(location.search);
if(q.has('t')) renderFrame(parseFloat(q.get('t')),{pal:q.get('pal')||'gray',cam:q.get('cam')||'game'});
else if(!navigator.webdriver){ const t0=performance.now(); (function loop(){ renderFrame((performance.now()-t0)/1000,{pal:q.get('pal')||'gray'}); requestAnimationFrame(loop); })(); }
