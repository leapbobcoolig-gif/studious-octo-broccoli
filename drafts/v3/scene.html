<script>
'use strict';
// ------------------------------------------------------------ palettes -----
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgb2hsl(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn); h= mx===r?(g-b)/d+(g<b?6:0): mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; } return [h,s,l]; }
function hsl2rgb(h,s,l){ h=((h%360)+360)%360/360; if(s===0) return [l*255,l*255,l*255].map(Math.round);
  const q=l<0.5?l*(1+s):l+s-l*s, p=2*l-q; const f=t=>{ t=(t+1)%1; return t<1/6?p+(q-p)*6*t: t<1/2?q: t<2/3?p+(q-p)*(2/3-t)*6:p; };
  return [f(h+1/3),f(h),f(h-1/3)].map(v=>Math.round(v*255)); }
function toward(h,target,amt){ const d=((target-h+540)%360)-180; return h+Math.sign(d)*Math.min(Math.abs(d),amt); }
// pxl's shadeRamp: cool saturated shadows -> warm pale lights
function shadeRamp(base,n,o={}){ const [h,s0,l0]=rgb2hsl(...hex(base)); const shift=o.shift??24, spread=o.spread??0.56, sat=o.sat??1;
  return Array.from({length:n},(_,i)=>{ const t=n===1?0:i/(n-1)-0.5; const l=Math.max(0.04,Math.min(0.96,l0+t*spread));
    const hh=t<0?toward(h,250,shift*-t*2):toward(h,55,shift*t*2); const s=Math.max(0,Math.min(1,s0*sat*(t<0?1+0.15*-t*2:1-0.3*t*2)));
    return hsl2rgb(hh,s,l); }); }
// 4-step ramps. skin ramps keep saturation low so shadows stay skin, not lipstick
const PALS={
  color:{ 1:['#4a3550',{spread:0.30}], 2:['#4b3d73',{spread:0.30}], 3:['#8a5a3e',{spread:0.5}], 4:['#cfc9e6',{spread:0.40,shift:14}],
    5:['#f2c6a8',{spread:0.42,shift:12,sat:0.55}], 6:['#f2c6a8',{spread:0.42,shift:12,sat:0.55}], 16:['#2b1b2b',{spread:0.22}],
    7:['#f1a3a8',{spread:0.38,shift:10,sat:0.95}], 8:['#d24f72',{spread:0.42,shift:10}], 9:['#c05a74',{spread:0.40,shift:10}],
    10:['#c99470',{spread:0.46,shift:12,sat:0.6}], 11:['#bf7a6c',{spread:0.50,shift:10,sat:0.85}], 12:['#3a2721',{spread:0.28,shift:10}],
    13:['#a58fb6',{spread:0.4}], 14:['#de7d8c',{spread:0.42,shift:10}], 17:['#1b2550',{spread:0.2}], 18:['#a2625a',{spread:0.40,shift:10,sat:0.8}],
    20:['#e58fb0',{spread:0.40,shift:10}], 21:['#2a1d2a',{spread:0.2}], 22:['#2c3a66',{spread:0.36,shift:10}],
    ui:{ink:'#1a0f1e',paper:'#fff6ea',uiD:'#2b1b33',uiM:'#5b4470',heart:'#ff5c8a',blush:'#ff7d9a',brow:'#3a2721'},
    net:'#2a1820', window0:'#0e1430', window1:'#1b2550', star:'#fff4c9', cloud:'#2c3768', ink:'#1a0f1e', glint:'#fff8ee' },
  gray:{ 1:['#4a4a4a',{spread:0.3}], 2:['#5a5a5a',{spread:0.25}], 3:['#8c8c8c',{spread:0.5}], 4:['#cdcdcd',{spread:0.40}],
    5:['#e6e6e6',{spread:0.38}], 6:['#e6e6e6',{spread:0.38}], 16:['#2a2a2a',{spread:0.2}], 7:['#ecbcc5',{spread:0.36}], 8:['#d9899a',{spread:0.45}], 9:['#c98595',{spread:0.4}],
    10:['#a8a8a8',{spread:0.46}], 11:['#8f8a8a',{spread:0.48}], 12:['#363636',{spread:0.28}], 13:['#9a9a9a',{spread:0.4}], 14:['#d9899a',{spread:0.45}], 17:['#2a2a2a',{spread:0.2}], 18:['#6e6969',{spread:0.4}],
    20:['#cfcfcf',{spread:0.40}], 21:['#2a2a2a',{spread:0.2}], 22:['#3a3a3a',{spread:0.3}],
    ui:{ink:'#121212',paper:'#f4f4f4',uiD:'#1e1e1e',uiM:'#4a4a4a',heart:'#e8a0ae',blush:'#e8a0ae',brow:'#2a2a2a'},
    net:'#262626', window0:'#1c1c1c', window1:'#2a2a2a', star:'#f4f4f4', cloud:'#3c3c3c', ink:'#121212', glint:'#ffffff' },
};
const rampCache={};
function ramps(pal){ if(rampCache[pal]) return rampCache[pal]; const P=PALS[pal], R={}; for(const k in P) if(Array.isArray(P[k])) R[k]=shadeRamp(P[k][0],4,P[k][1]); return rampCache[pal]=R; }
const group=m=> m===10||m===12||m===20||m===21||m===22 ? 'him' : (m===11||m===14||m===18) ? 'gen' : (m===7||m===8||m===9) ? 'puss' : (m===5||m===6||m===16) ? 'her' : 'room';

// --------------------------------------------------------- pixel post -----
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+0.5)/16);
function post(bufs, w, h, opt){
  const [g0,g1,g2]=bufs, P=PALS[opt.pal]||PALS.gray, R=ramps(opt.pal), N=w*h;
  const mat=new Uint8Array(N), dep=new Float32Array(N), nrm=new Float32Array(N*3), ao=new Float32Array(N).fill(1);
  for(let i=0;i<N;i++){ mat[i]=Math.round(g0[i*4]); dep[i]=g0[i*4+1]; nrm[i*3]=g1[i*4]; nrm[i*3+1]=g1[i*4+1]; nrm[i*3+2]=g1[i*4+2]; }

  const focal=h/(2*Math.tan(opt.cam.fov*Math.PI/360));
  const K=[[1,0],[0.7,0.7],[0,1],[-0.7,0.7],[-1,0],[-0.7,-0.7],[0,-1],[0.7,-0.7],[0.5,0.2],[-0.2,0.5],[-0.5,-0.2],[0.2,-0.5]];

  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i=y*w+x; if(!mat[i]) continue;
    const gx=Math.abs(dep[i+1]-dep[i])<Math.abs(dep[i]-dep[i-1])?dep[i+1]-dep[i]:dep[i]-dep[i-1];
    const gy=Math.abs(dep[i+w]-dep[i])<Math.abs(dep[i]-dep[i-w])?dep[i+w]-dep[i]:dep[i]-dep[i-w];
    const rpx=Math.max(1.5,Math.min(10, 0.05*focal/dep[i])); let occ=0;
    for(const [kx,ky] of K){ const ox=kx*rpx, oy=ky*rpx, X=Math.round(x+ox), Y=Math.round(y+oy); if(X<0||Y<0||X>=w||Y>=h) continue; const j=Y*w+X; if(!mat[j]) continue;
      const pred=dep[i]+gx*ox+gy*oy; const dz=pred-dep[j]; if(dz>0.016 && dz<0.25) occ+=1-dz/0.25; }
    ao[i]=1-Math.min(1,occ/K.length*1.9);
  }
  { const a2=ao.slice(); for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i=y*w+x; if(!mat[i]) continue; let s=0,c=0;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const j=i+dy*w+dx; if(mat[j] && group(mat[j])===group(mat[i])){ s+=a2[j]; c++; } } ao[i]=s/c; } }
  const shade=new Float32Array(N);
  for(let i=0;i<N;i++){ if(!mat[i]) continue;
    const key=g0[i*4+2], vdn=g1[i*4+3], spec=g2[i*4], rim=g2[i*4+1];
    const ndl=nrm[i*3]*-0.45+nrm[i*3+1]*0.85+nrm[i*3+2]*0.55;
    const keyRaw=g0[i*4+3]; const softKey=keyRaw*(0.38+0.62*(keyRaw>0.001?Math.min(1,key/keyRaw):0));
    let s=0.13+0.60*softKey+0.12*Math.max(0,(ndl/1.13+0.4)/1.4)+(group(mat[i])!=='room'?0.16*vdn:0.06*vdn);   // key + sky + camera-side fill
    s*=mixf(1,ao[i],0.8); s+=rim*0.30;
    if(opt.flat) s=0.42+0.58*s;
    shade[i]= opt.mode==='clay' ? (0.12+0.55*vdn+0.35*key)*mixf(1,ao[i],0.7) : s;
  }
  // edges: silhouette (depth jump), body/body contact, sharp creases
  const edge=new Uint8Array(N);
  const nb=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x, m=mat[i]; if(!m) continue; const gi=group(m);
    for(const [dx,dy] of nb){ const X=x+dx, Y=y+dy; if(X<0||Y<0||X>=w||Y>=h) continue; const j=Y*w+X, mj=mat[j];
      if(!mj){ edge[i]=2; break; }
      const dz=dep[j]-dep[i];
      if(dz>0.03*dep[i]+0.012){ edge[i]= gi!=='room'&&group(mj)==='room' ? 2 : 1; break; }
      if(gi!=='room' && group(mj)!==gi && dz>0){ edge[i]=1; break; }
      if(gi!=='room' && !(opt.noCrease && m!==12 && mj!==12)){ const cd=nrm[i*3]*nrm[j*3]+nrm[i*3+1]*nrm[j*3+1]+nrm[i*3+2]*nrm[j*3+2]; if(cd<0.45 && dz>0){ edge[i]=1; break; } }
      if(m!==mj && (m===12||mj===12||m===22||mj===22) && dz>0){ edge[i]=1; break; }
    } }
  // tone levels: few, crisp bands; top band kept small so it reads as a highlight, not plastic
  const lvl=new Int8Array(N).fill(-1);
  for(let i=0;i<N;i++){ if(!mat[i]) continue; const v=shade[i]; lvl[i]= v<0.34?0 : v<0.58?1 : v<0.84?2 : 3; }

  for(let pass=0;pass<2;pass++){ const L2=lvl.slice();
    for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i=y*w+x; if(lvl[i]<0||edge[i]) continue;
      const cnt=[0,0,0,0]; let same=0, tot=0;
      for(const j of [i-1,i+1,i-w,i+w]){ if(mat[j]!==mat[i]||edge[j]) continue; tot++; cnt[lvl[j]]++; if(lvl[j]===lvl[i]) same++; }

    if(!m) c=[0,0,0];
    else if(opt.mode==='clay'){ const s=Math.min(1.15,shade[i]); const g=group(m);
      const tint = g==='him'?[150,175,230] : g==='gen'?[120,140,210] : m===7||m===8||m===9?[255,140,160] : g==='her'?(m===6||m===16?[200,160,140]:[250,215,190]) : [120,120,120];
      c=tint.map(v=>Math.min(255,v*s)); if(edge[i]) c=[25,22,28]; }
    else {
      const r=R[m]; const L=lvl[i];

      if(g2[i*4]>0.82 && (m===5||m===10||m===14||m===8)) c=hex(P.glint);
      if(m===6 && ((x+y)%4===0 || (x-y+400)%4===0)) c= L<=1 ? hex(P.ink) : hex(P.net);
      if(m===17) c=windowPx(x,y,g2[i*4+2],g2[i*4+3],P);
      if(m===20 && opt.shirt){ c=opt.shirt[L]; if(opt.flannel && ((((x>>1)+(y>>1))&1)===0 || (x%4===0))) c=opt.shirt[Math.max(0,L-2)]; }
      if(edge[i]) c = edge[i]===2 ? ink : (r? r[0].map(v=>v*0.6) : ink);

    out[i*4]=c[0]; out[i*4+1]=c[1]; out[i*4+2]=c[2]; out[i*4+3]=255; }
  if(opt.mode!=='clay') cleanup(out,w,h);
  return out;
}
function cleanup(o,w,h){ const key=i=>(o[i*4]<<16)|(o[i*4+1]<<8)|o[i*4+2]; const s=new Int32Array(w*h); for(let i=0;i<w*h;i++) s[i]=key(i);
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i=y*w+x, a=s[i-1],b=s[i+1],c=s[i-w],d=s[i+w];
    if(a===b&&b===c&&c===d&&a!==s[i]){ o[i*4]=a>>16; o[i*4+1]=(a>>8)&255; o[i*4+2]=a&255; } } }
function windowPx(sx,sy,wx,wy,P){
  const cx=wx<0?-1.22:1.22, lx=wx-cx, ly=wy-0.84;
  const hsh=Math.sin(sx*12.9898+sy*78.233)*43758.5453, r=hsh-Math.floor(hsh);
  const cloud= ly < -0.10 + 0.07*Math.sin(lx*9.0+cx*3) + 0.035*Math.sin(lx*23.0+1.0);
  if(cloud) return hex(ly < -0.22 + 0.05*Math.sin(lx*13+2) ? P.cloud : P.window1);
  if(r>0.982) return hex(P.star);
  return hex(ly>0.12?P.window0:P.window1);
}

// ------------------------------------------------------------- setup ------
const H=window.HUMANS;
const her=new Human(H,'female'), him=new Human(H,'male');
setupFemale(her); setupMale(him);
glInit();
const room=glMesh('room', buildRoom());
const CAMS={
  game:{p:[0,1.02,1.90], at:[0,0.40,-0.06], fov:20},
  wide:{p:[0,0.95,2.6], at:[0,0.38,-0.1], fov:34},
  side:{p:[2.3,0.5,0.05], at:[0,0.33,-0.1], fov:40},
  quarter:{p:[1.4,1.0,1.4], at:[0,0.33,-0.1], fov:40},
  top:{p:[0,2.7,0.0], at:[0,0.3,-0.06], fov:40, up:[0,0,-1]},
  close:{p:[0,0.55,0.92], at:[0,0.34,0.02], fov:40},
  macro:{p:[0,0.40,0.62], at:[0,0.31,0.05], fov:40},
  low:{p:[0,0.34,1.25], at:[0,0.33,0.0], fov:44},
  herback:{p:[0,0.45,1.0], at:[0,0.28,0.0], fov:40},
  herside:{p:[1.6,0.35,0.0], at:[0,0.3,-0.1], fov:40},
};
const outC=document.getElementById('out'), octx=outC.getContext('2d');
const himP=new Human(H,'male'); setupPortrait(himP);
const PCAM={p:[0.17,1.62,1.05], at:[0.0,1.595,0.05], fov:20};
const SHIRTS={color:{6:'#e58fb0',3:'#e9e6f0',0:'#b4433f'}, gray:{6:'#d8d8d8',3:'#efefef',0:'#7a7a7a'}};
function renderPortrait(stage, t, opt){
  const pw=64, ph=72;
  const cap=glMesh('cap', dressPortrait(himP, stage));
  const body=glMesh('himP',{pos:himP.pos,nrm:himP.nrm,mat:himP.mat,idx:himP.tris});
  const bufs=renderGBuffer([body,cap], PCAM, pw, ph);
  const st = stage>=5?6: stage>=2?3:0;
  const sc=SHIRTS[opt.pal]||SHIRTS.gray;
  const px=post(bufs,pw,ph,Object.assign({},opt,{cam:PCAM, noCrease:true, flat:true, shirt:shadeRamp(sc[st],4,{spread:0.42,shift:10}), flannel:st===0}));
  const VP=camVP(PCAM,pw,ph);
  const L=himP.lm, eL=project(VP,L.eyeL,pw,ph), eR=project(VP,L.eyeR,pw,ph), mo=project(VP,add(L.mouth,[0,0,0.004]),pw,ph);
  // background behind him (empty pixels)
  const P=PALS[opt.pal]||PALS.gray, U=P.ui;
  for(let i=0;i<pw*ph;i++) if(px[i*4]===0&&px[i*4+1]===0&&px[i*4+2]===0){ const y=(i/pw)|0, x=i%pw; const c=hexc(((x+y)&1)&&y>ph*0.55?U.uiM:U.uiD); px[i*4]=c[0];px[i*4+1]=c[1];px[i*4+2]=c[2]; }
  const c=new Canvas2(px,pw,ph);
  UI.drawExpression(c, stage, [eR,eL].sort((a,b)=>a[0]-b[0]), mo, {ink:hexc(U.ink),brow:hexc(U.brow),heart:hexc(U.heart),blush:hexc(U.blush)}, t);
  return {px,pw,ph};
}
function renderFrame(t, opt={}){
  opt=Object.assign({pal:'gray', mode:'pixel', cam:'game', w:320, h:180, kinsey:3, ui:true, score:7815, hearts:3, combo:[1604,40]}, opt);
  opt.cam = typeof opt.cam==='string' ? CAMS[opt.cam] : opt.cam;
  const S=posePress(her, him, t, opt);
  const herM=glMesh('her',{pos:her.pos,nrm:her.nrm,mat:her.mat,idx:her.tris});
  const himM=glMesh('him',{pos:him.pos,nrm:him.nrm,mat:him.mat,idx:him.tris});
  const genM=glMesh('gen', buildGenitals(S, him));
  const list=[room,herM,himM,genM].filter((m,k)=>!(opt.hide||[]).includes(['room','her','him','gen'][k]));
  const bufs=renderGBuffer(list, opt.cam, opt.w, opt.h);
  const px=post(bufs, opt.w, opt.h, opt);
  if(opt.ui && opt.mode!=='clay'){
    const P=PALS[opt.pal]||PALS.gray, U=P.ui, C={}; for(const k in U) C[k]=hexc(U[k]);
    const c=new Canvas2(px,opt.w,opt.h);
    // rhythm ring on her pussy: shrinks onto it, lands on the slam
    const VP=camVP(opt.cam,opt.w,opt.h), vp=project(VP,S.V,opt.w,opt.h);
    const period=opt._period, ph=((t/period)%1+1)%1, toHit=((opt._slam-ph)+1)%1;
    const judge = toHit>0.9||toHit<0.04 ? (Math.floor(t/period)%3===2?'GOOD':'PERFECT!') : null;
    UI.rhythm(c, vp[0], vp[1], toHit<0.7?toHit/0.7:0, C, judge);
    if(S.out<0.12) c.textOutlined('PLAP!', Math.round(vp[0])+22, Math.round(vp[1])-28, C.paper, C.ink);
    const pr=renderPortrait(opt.kinsey, t, opt);
    const pxX=4, pxY=opt.h-pr.ph-4;
    c.rect(pxX-2,pxY-2,pr.pw+4,pr.ph+4,C.ink); c.copyFrom(pr.px,pr.pw,pr.ph,pxX,pxY);
    const lines=UI.LINES[opt.kinsey]||UI.LINES[3]; const ln=lines[Math.floor(t/3)%lines.length];
    UI.speech(c, pxX+pr.pw+6, pxY+2, ln, C);
    UI.hud(c, {score:opt.score, hearts:opt.hearts, combo:opt.combo, kinsey:opt.kinsey, toolHot:-1}, C);
  }
  outC.width=opt.w; outC.height=opt.h; octx.putImageData(new ImageData(px,opt.w,opt.h),0,0);
  return S;
}
window.renderFrame=renderFrame;
// ---------------------------------------------------- reference export ----
// compact guide layers for the sprite tracer: material id, distance, shade, spec, normal, couple-shadow
function b64u8(u8){ let s=''; const CH=0x8000; for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); return btoa(s); }
function shadeOf(g0,g1,g2,i,mat){
  const key=g0[i*4+2], keyRaw=g0[i*4+3], vdn=g1[i*4+3], rim=g2[i*4+1];
  const ndl=g1[i*4]*-0.45+g1[i*4+1]*0.85+g1[i*4+2]*0.55;
  const softKey=keyRaw*(0.38+0.62*(keyRaw>0.001?Math.min(1,key/keyRaw):0));
  return 0.13+0.60*softKey+0.12*Math.max(0,(ndl/1.13+0.4)/1.4)+(group(mat)!=='room'?0.16*vdn:0.06*vdn)+rim*0.3;
}
window.refBuffers=function(t, opt){
  opt=Object.assign({cam:'game', w:1280, h:720, kinsey:0}, opt);
  const cam=typeof opt.cam==='string'?CAMS[opt.cam]:opt.cam;
  const S=posePress(her, him, t, opt);
  const herM=glMesh('her',{pos:her.pos,nrm:her.nrm,mat:her.mat,idx:her.tris});
  const himM=glMesh('him',{pos:him.pos,nrm:him.nrm,mat:him.mat,idx:him.tris});
  const genM=glMesh('gen', buildGenitals(S, him));
  const w=opt.w, h=opt.h, N=w*h;
  const full=renderGBuffer(opt.noGen?[room,herM,himM]:[room,herM,himM,genM], cam, w, h);
  const bare=opt.withShadow? renderGBuffer([room], cam, w, h) : null;
  const [g0,g1,g2]=full;
  const mat=new Uint8Array(N), shade=new Uint8Array(N), spec=new Uint8Array(N), nrm=new Int8Array(N*3), dist=new Float32Array(N), cs=new Uint8Array(N), wxy=new Float32Array(N*2);
  for(let i=0;i<N;i++){ const m=Math.round(g0[i*4]); mat[i]=m; dist[i]=g0[i*4+1];
    if(!m) continue;
    shade[i]=Math.max(0,Math.min(255,Math.round(shadeOf(g0,g1,g2,i,m)*200)));
    spec[i]=Math.max(0,Math.min(255,Math.round(g2[i*4]*255)));
    nrm[i*3]=Math.round(g1[i*4]*127); nrm[i*3+1]=Math.round(g1[i*4+1]*127); nrm[i*3+2]=Math.round(g1[i*4+2]*127);
    wxy[i*2]=g2[i*4+2]; wxy[i*2+1]=g2[i*4+3];
    if(bare && group(m)==='room'){ const b=bare[0]; if(b[i*4+2]-g0[i*4+2]>0.15) cs[i]=1; } }
  const VP=camVP(cam,w,h); const P2=(p)=>{ const q=project(VP,p,w,h); return [q[0],q[1]]; };
  const v=P2(S.V), ax=P2(add(S.V,mul(S.Ax,0.04))), xs=P2(add(S.V,mul(S.Xs,0.04)));
  const anchors={ V:v, slitUp:[ax[0]-v[0],ax[1]-v[1]], side:[xs[0]-v[0],xs[1]-v[1]], anus:P2(S.anus), ballC:P2(S.ballC), root:P2(S.root),
    ballTop:P2(add(S.ballC,[0,S.ballR,0])), ballBot:P2(add(S.ballC,[0,-S.ballR,0])), shaftR:Math.abs(P2(add(S.V,mul(S.Xs,0.0275)))[0]-v[0]) };
  return { w,h, out:S.out, jig:S.jig, swing:S.swing, V:v, anchors,
    mat:b64u8(mat), shade:b64u8(shade), spec:b64u8(spec), nrm:b64u8(new Uint8Array(nrm.buffer)), dist:b64u8(new Uint8Array(dist.buffer)), cs:b64u8(cs), wxy:b64u8(new Uint8Array(wxy.buffer)) };
};
const q=new URLSearchParams(location.search);
if(q.has('t')) renderFrame(parseFloat(q.get('t')),{pal:q.get('pal')||'gray',cam:q.get('cam')||'game'});
else if(!navigator.webdriver){ const t0=performance.now(); (function loop(){ renderFrame((performance.now()-t0)/1000,{pal:q.get('pal')||'gray',cam:q.get('cam')||'game'}); requestAnimationFrame(loop); })(); }
