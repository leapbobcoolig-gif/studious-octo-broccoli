<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Straight Up Bedroom</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --bg:#0d0a12; --panel:#1c1426; --ink:#f4e9f2; --accent:#ff5c8a; }
  html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.3 ui-monospace,Menlo,monospace}
  #wrap{position:relative;width:min(100vw,177.7vh);margin:0 auto}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
  #hud{position:absolute;inset:0}
  #bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px}
  button,label{background:var(--panel);color:var(--ink);border:1px solid #3b2b4d;border-radius:4px;padding:5px 9px;font:inherit;cursor:pointer}
  button.on{border-color:var(--accent);color:var(--accent)}
  input[type=range]{vertical-align:middle}
  #wrap{touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #modal{position:fixed;inset:0;background:rgba(8,5,12,.82);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:5}
  #modal[hidden]{display:none}
  #sheet{background:#1c1426;border:2px solid #3b2b4d;border-radius:6px;max-width:640px;width:100%;padding:14px 16px;box-sizing:border-box}
  #sheet h2{margin:0 0 4px;font-size:16px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
  #sheet .sub{color:#a691b0;margin:0 0 10px}
  #sheet .row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid #2e2240}
  #sheet .row b{color:#fff}
  #sheet .row small{color:#a691b0;display:block}
  #sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  #sheet .al{background:#251b33;border:1px solid #3b2b4d;border-radius:4px;padding:6px;display:flex;gap:6px;min-width:0}
  #sheet .al canvas{width:51px;height:60px;image-rendering:pixelated;flex:none}
  #sheet .al div{min-width:0;font-size:11px;line-height:1.35}
  #sheet .gold{color:#ffce5c} #sheet .ok{color:#78dc8c} #sheet .dim{color:#6f5c80}
  #sheet .close{float:right}
  #sheet button[disabled]{opacity:.45;cursor:default}
</style>
</head>
<body>
<div id="wrap"><canvas id="gl" width="320" height="180"></canvas><canvas id="hud" width="320" height="180"></canvas></div>
<div id="bar">
  <button data-panel="shop">Shop</button>
  <button data-panel="lounge">Bro Lounge</button>
  <button data-panel="city">City &amp; Rebirth</button>
  <button data-panel="trophies">Trophies</button>
  <button data-panel="stats">Stats</button>
  <button data-panel="settings">Settings</button>
</div>
<p style="text-align:center;color:#a691b0;margin:2px 12px 12px">Tap the screen (or space) when he bottoms out. Tools on the right: lube (L), broom (B), water (W), hold to edge (E), new lover.</p>
<div id="modal" hidden><div id="sheet"></div></div>
<script src="ui.js"></script>
<script src="game.js"></script>
<script>
'use strict';
// ------------------------------------------------------------ palette ------
// same hue-shifted ramps as sprites/palette.px.js, but 8 steps so light can sweep smoothly
function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgb2hsl(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn); h= mx===r?(g-b)/d+(g<b?6:0): mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; } return [h,s,l]; }
function hsl2rgb(h,s,l){ h=((h%360)+360)%360/360; if(s===0) return [l*255,l*255,l*255].map(Math.round);
  const q=l<0.5?l*(1+s):l+s-l*s, p=2*l-q; const f=t=>{ t=(t+1)%1; return t<1/6?p+(q-p)*6*t: t<1/2?q: t<2/3?p+(q-p)*(2/3-t)*6:p; };
  return [f(h+1/3),f(h),f(h-1/3)].map(v=>Math.round(v*255)); }
function toward(h,t,a){ const d=((t-h+540)%360)-180; return h+Math.sign(d)*Math.min(Math.abs(d),a); }
function shadeRamp(base,n,o={}){ const [h,s0,l0]=rgb2hsl(...hex(base)); const shift=o.shift??24, spread=o.spread??0.56, sat=o.sat??1;
  return Array.from({length:n},(_,i)=>{ const t=n===1?0:i/(n-1)-0.5; const lo=o.lo??spread/2, hi=o.hi??spread/2; const l=Math.max(0.04,Math.min(0.93,l0+(t<0?t*2*lo:t*2*hi)));
    const hh=t<0?toward(h,250,shift*-t*2):toward(h,55,shift*t*2); const s=Math.max(0,Math.min(1,s0*sat*(t<0?1-0.1*-t*2:1-0.3*t*2)));
    return hsl2rgb(hh,s,l); }); }
// material: keys, base colour, ramp options, shininess, specular strength
const MATS=[null,
  {keys:'abcde', base:'#e9b294', o:{lo:0.42,hi:0.11,shift:20,sat:0.66}, shin:28, spec:0.30},   // 1 her skin (oiled)
  {keys:'fghi',  base:'#de968a', o:{lo:0.40,hi:0.11,shift:16,sat:0.75}, shin:30, spec:0.30},   // 2 outer lips
  {keys:'jkmp',  base:'#d0506e', o:{lo:0.36,hi:0.15,shift:8},     shin:60, spec:0.60},   // 3 wet pink
  {keys:'uv',    base:'#b45a6c', o:{spread:0.50,shift:8},           shin:20, spec:0.30},   // 4 asshole
  {keys:'ABCDE', base:'#b5764a', o:{lo:0.42,hi:0.11,shift:8,sat:0.95}, shin:22, spec:0.18},   // 5 his skin
  {keys:'WXYZ',  base:'#4a3328', o:{spread:0.50,shift:10},          shin:10, spec:0.10},   // 6 hair
  {keys:'FGHIJK',base:'#a8594c', o:{lo:0.34,hi:0.13,shift:8,sat:0.9}, shin:18, spec:0.22},   // 7 shaft / sack
  {keys:'PQRS',  base:'#d9708a', o:{spread:0.70,shift:10},          shin:50, spec:0.80},   // 8 glans
];
const LINES={ z:'#1a0f1e', o:'#9a5446', O:'#5a3428', V:'#4a2222', x:'#6e2238', n:'#2a1820', l:'#2b1b2b', L:'#4a3047' };
const RAMP_N=8;
function buildLUTs(gray){
  const g=GAME.guy(), hue=(GAME.shinyOn()||GAME.rainbowOn())?(performance.now()/8)%360:0;
  const lut=new Uint8Array(256*4), lineCol=new Uint8Array(256*4), ramp=new Uint8Array(RAMP_N*16*4);
  MATS.forEach((m,mi)=>{ if(!m) return;
    let base=m.base; if(g&&mi===5) base=g.tone[0]; if(g&&mi===7) base=g.tone[1];
    if(hue&&(mi===5||(GAME.rainbowOn()&&mi===1))){ const [h,s2,l]=rgb2hsl(...hex(base)); const c=hsl2rgb(h+hue,Math.max(s2,0.55),l); base='#'+c.map(v=>v.toString(16).padStart(2,'0')).join(''); }
    let r=shadeRamp(base,RAMP_N,m.o);
    if(gray && mi!==2 && mi!==3 && mi!==4 && mi!==8) r=r.map(c=>{ const v=Math.round(0.3*c[0]+0.59*c[1]+0.11*c[2]); return [v,v,v]; });
    r.forEach((c,i)=>ramp.set([...c,255],(mi*RAMP_N+i)*4));
    [...m.keys].forEach((k,ti)=>lut.set([mi, Math.round(ti/(m.keys.length-1)*255), 0, 255], k.charCodeAt(0)*4)); });
  for(const [k,h] of Object.entries(LINES)){ let c=hex(h); if(gray){ const v=Math.round(0.3*c[0]+0.59*c[1]+0.11*c[2]); c=[v,v,v]; }
    lut.set([0,0,255,255],k.charCodeAt(0)*4); lineCol.set([...c,255],k.charCodeAt(0)*4); }
  return {lut,lineCol,ramp};
}

// -------------------------------------------------------------- WebGL ------
const cv=document.getElementById('gl'), gl=cv.getContext('webgl2',{antialias:false,premultipliedAlpha:false});
const VS=`#version 300 es
void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position=vec4(p*2.-1.,0.,1.); }`;
const FS=`#version 300 es
precision highp float;
uniform sampler2D uMat,uNrm,uRoom,uLut,uLine,uRamp;
uniform int uFrame; uniform vec3 uLamp; uniform float uLampOn, uPixel, uTime, uSheen;
uniform vec4 uCheek[2];   // offset xy, squash
uniform vec4 uBall[2];    // centre xy, offset xy
uniform vec4 uSack;       // top y, squash L, squash R
uniform vec4 uLeg;        // swing angle L, R
out vec4 o;
const float RN=${RAMP_N}.;
vec3 ramp(float mat, float t){ t=clamp(t,0.,1.)*(RN-1.); float i=floor(t), f=t-i;
  vec3 a=texelFetch(uRamp, ivec2(int(mat)*${RAMP_N}+int(i),0),0).rgb, b=texelFetch(uRamp, ivec2(int(mat)*${RAMP_N}+int(min(i+1.,RN-1.)),0),0).rgb;
  return mix(a,b,f); }
float bayer(ivec2 p){ int x=p.x&3, y=p.y&3; int m[16]=int[16](0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5); return (float(m[y*4+x])+0.5)/16.; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
vec4 matAt(int layer, vec2 q){ ivec2 s=ivec2(floor(q)); if(s.x<0||s.y<0||s.x>319||s.y>179) return vec4(0.); return texelFetch(uMat, ivec2(uFrame*320+s.x, layer*180+s.y),0); }
int partOf(vec4 m){ return int(m.b*255.+0.5); }
// physics: find which source pixel lands on screen pixel p (inverse warp, per body part)
vec4 pickMat(vec2 p, out ivec2 src, out int layer){

  { float neck=smoothstep(uSack.x-2.,uSack.x+14.,p.y);
    float w0=exp(-dot(p-uBall[0].xy-uBall[0].zw,p-uBall[0].xy-uBall[0].zw)/288.), w1=exp(-dot(p-uBall[1].xy-uBall[1].zw,p-uBall[1].xy-uBall[1].zw)/288.);
    float tot=max(w0+w1,1e-4), k=min(1.,(w0+w1)*1.6)*neck; vec2 q=p-(uBall[0].zw*w0+uBall[1].zw*w1)/tot*k;
    for(int i=0;i<2;i++){ vec2 c=uBall[i].xy+uBall[i].zw; float w=(i==0?w0:w1)/tot*k; float sq=(i==0?uSack.y:uSack.z)*w;
      vec2 bot=c+vec2(0.,10.); q=mix(q, bot+(q-bot)/vec2(1.+sq*0.08,1.-sq*0.08), w); }
    vec4 m=matAt(1,q); if(m.a>0.5){ src=ivec2(floor(q)); layer=1; return m; } }
  layer=0;
  // her legs swing from the hips (more toward her feet)
  for(int i=0;i<2;i++){ vec2 pv=vec2(i==0?126.:194.,88.); float w=clamp((pv.y-p.y)/120.,0.,1.);
    vec2 q=pv+rot(-(i==0?uLeg.x:uLeg.y)*w)*(p-pv); vec4 m=matAt(0,q); if(m.a>0.5 && partOf(m)==1+i){ src=ivec2(floor(q)); return m; } }
  // her cheeks jiggle and squash
  for(int i=0;i<2;i++){ vec2 c=vec2(i==0?136.:184.,114.); vec2 d=(p-c)/vec2(31.,35.); float w=smoothstep(1.15,0.2,length(d))*smoothstep(1.,6.,abs(p.x-160.));
    vec2 sc=vec2(1.+uCheek[i].z*0.10*w,1.-uCheek[i].z*0.12*w); vec2 q=p-uCheek[i].xy*w; q=mix(q,c+(q-c)/sc,w);
    vec4 m=matAt(0,q); if(m.a>0.5 && (partOf(m)==3+i || (partOf(m)==4-i && abs(q.x-160.)<3.))){ src=ivec2(floor(q)); return m; } }
  vec4 m=matAt(0,p); int pt=partOf(m);
  if(pt>=1 && pt<=2){ src=ivec2(floor(p)); return vec4(0.); }   // that bit of her leg moved away: the room shows through
  src=ivec2(floor(p)); return m; }
void main(){
  ivec2 p=ivec2(gl_FragCoord.xy); p.y=179-p.y;
  vec3 room=texelFetch(uRoom,p,0).rgb;
  vec3 lampC=vec3(1.0,0.72,0.45);
  vec3 toLampR=uLamp-vec3(vec2(p),0.); float dR=length(toLampR.xy);
  float glow=uLampOn*0.55/(1.+dR*dR/(110.*110.));
  ivec2 src; int layer; vec4 m=pickMat(vec2(p)+0.5, src, layer);
  if(m.a<0.5){ o=vec4(room*(0.62+glow*lampC*1.1),1.); return; }
  int key=int(m.r*255.+0.5); float flag=m.g*255.;
  vec4 lu=texelFetch(uLut, ivec2(key,0),0);
  if(lu.b>0.5){ vec3 c=texelFetch(uLine, ivec2(key,0),0).rgb; o=vec4(c*(0.85+glow*lampC*0.6),1.); return; }
  float mat=lu.r*255.; float tone=lu.g;
  vec3 n=normalize(texelFetch(uNrm, ivec2(uFrame*320+src.x, layer*180+src.y),0).rgb*2.-1.);
  // lights in screen space (x right, y down, z toward the viewer)
  vec3 L=normalize(vec3(-0.55,-0.62,0.58));
  float key_=max(0.,(dot(n,L)+0.08)/1.08);
  float fill=max(0.,dot(n,normalize(vec3(0.7,0.15,0.7))))*0.22;
  float rim=pow(1.-max(n.z,0.),2.2)*max(0.,dot(normalize(n.xy+1e-4),normalize(vec2(0.75,-0.65))))*0.45;
  vec3 toLamp=uLamp-vec3(vec2(p),0.); float dl=length(toLamp);
  float lamp=uLampOn*max(0.,dot(n,normalize(toLamp)))*1.15/(1.+dl*dl/(95.*95.));
  // contact shading: darken next to creases, outlines and other materials (crack, sack on her, thigh edges)
  float occ=0.;
  for(int i=0;i<8;i++){ float a=float(i)*0.785; vec2 d=vec2(cos(a),sin(a));
    for(int r=1;r<=3;r++){ ivec2 q=p+ivec2(round(d*float(r*2))); vec4 mq=texelFetch(uMat, ivec2(uFrame*320+clamp(q.x,0,319), clamp(q.y,0,179)),0);
      float w=1./float(r);
      if(mq.a<0.5) occ+=0.25*w;
      else { float fq=mq.g*255.; vec4 lq=texelFetch(uLut, ivec2(int(mq.r*255.+0.5),0),0);
        if(fq>0.5 || abs(lq.r*255.-mat)>0.5) occ+=w; } } }
  float ao=1.-clamp(occ/9.,0.,1.)*0.75;
  if(layer==1) ao=max(ao,0.9);                                    // the sack sits out in front: its own shading, not the crease shading behind it

  float shin=mat==1.?28.:mat==2.?30.:mat==3.?60.:mat==5.?22.:mat==7.?18.:mat==8.?50.:12.;
  float sstr=mat==1.?0.55:mat==2.?0.5:mat==3.?0.9:mat==5.?0.35:mat==7.?0.35:mat==8.?0.8:0.1;
  if(mat==5.) sstr*=uSheen;
  float spec=pow(max(0.,dot(n,normalize(L+vec3(0,0,1)))),shin)*sstr + uLampOn*pow(max(0.,dot(n,normalize(normalize(toLamp)+vec3(0,0,1)))),shin)*sstr*0.8/(1.+dl*dl/(95.*95.));
  float t=lum*0.86;
  if(uPixel>0.5){ float s=t*5.; float fr=fract(s); float b=bayer(p); s=floor(s)+(fr>0.78&&b<(fr-0.78)/0.22?1.:0.); t=s/5.; spec=spec>0.45?1.:0.; }
  vec3 c=ramp(mat,t);
  c+= spec*mix(vec3(1.,0.9,0.8),c*1.4,0.5)*(uPixel>0.5?0.4:0.5);
  c*= mix(vec3(1.),vec3(1.08,0.98,0.9),uLampOn*min(1.,lamp));
  o=vec4(c,1.);
}`;
function sh(t,s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x); if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
const prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
function tex(unit, w, h, data){ const t=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false); gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL,gl.NONE);
  if(data && data.width && !(data instanceof Uint8Array)) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,data);
  else gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,data); return t; }
const U=n=>gl.getUniformLocation(prog,n);
// decode sprite data exactly (no colour profile, no premultiplied alpha): these PNGs hold numbers, not colours
// (data: URIs are decoded by hand: the artifact viewer blocks fetch() for them)
function dataBlob(src){ const [head,b64]=src.split(','); const bin=atob(b64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:head.slice(5).split(';')[0]}); }
async function loadImg(src){ const blob=src.startsWith('data:')?dataBlob(src):await (await fetch(src)).blob();
  try{ return await createImageBitmap(blob,{premultiplyAlpha:'none',colorSpaceConversion:'none'}); }
  catch(e){ return await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(blob); }); } }

// -------------------------------------------------------------- state ------
const S=GAME.S.settings; let MOUSE=null;
let META, rooms={};
function setLUTs(){ const L=buildLUTs(S.gray); tex(3,256,1,L.lut); tex(4,256,1,L.lineCol); tex(5,RAMP_N*16,1,L.ramp); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, S.gray?rooms.gray:rooms.color); }
async function bootInner(){
  const [mat,nrm,rc,rg,meta]=await Promise.all([loadImg('game/sprites/press_close.mat.png'),loadImg('game/sprites/press_close.nrm.png'),
    loadImg('game/sprites/room_color.png'),loadImg('game/sprites/room_gray.png'),fetch('game/sprites/press_close.json').then(r=>r.json()).catch(()=>null)]);
  META=meta||{frames:[120,50,40,70,60,60,70,80].map(ms=>({ms}))};
  tex(0,0,0,mat); tex(1,0,0,nrm); rooms.color=tex(2,0,0,rc); rooms.gray=tex(2,0,0,rg);
  GAME.init(META,{ onGuy:()=>setLUTs(), openPanel:(n)=>openPanel(n) });
  setLUTs();
  gl.uniform1i(U('uMat'),0); gl.uniform1i(U('uNrm'),1); gl.uniform1i(U('uRoom'),2); gl.uniform1i(U('uLut'),3); gl.uniform1i(U('uLine'),4); gl.uniform1i(U('uRamp'),5);
  requestAnimationFrame(loop);
}
async function boot(){ try{ await bootInner(); }catch(e){ console.error(e); const p=document.createElement('p'); p.style.cssText='color:#ff5c8a;text-align:center;padding:12px'; p.textContent='The game could not start: '+(e&&e.message||e); document.body.prepend(p); } }
// -------------------------------------------------------------- loop -------
const hud=document.getElementById('hud'), hctx=hud.getContext('2d'), hbuf=new Uint8ClampedArray(320*180*4);

// 2D springs in screen pixels. The slam (frame 3) kicks her cheeks, legs and his balls;
// the balls also lag behind every jump of the sprite's own sack position, then swing back.

function spring(o,k,c,dt){ for(let i=0;i<2;i++){ o.v[i]+=(-k*o.x[i]-c*o.v[i])*dt; o.x[i]+=o.v[i]*dt; } }

  PH.leg.forEach((l,i)=>{ l.v+=(i?1:-1)*1.1*power*(0.8+Math.random()*0.4); });

  const fr=META.frames[f];
  if(f!==PH.prevFrame){ if(f===3) slam(GAME.power()); PH.prevFrame=f; }
  if(PH.prevBy===null) PH.prevBy=fr.by;

    spring(b,95,3.2,dt);
    const floor=fr.mode==='slap'?1.5:fr.mode==='mid'?4:6;          // the sack can't sink into her
    if(b.x[1]>floor){ const hit=b.v[1]; b.x[1]=floor; if(hit>0){ b.v[1]=-hit*0.35; if(hit>60){ PH.ballSq[i]=Math.min(1,hit/260); PH.plap=0.3; PH.cheek.forEach(c=>c.v[1]+=hit*0.12); } } }
    b.x[1]=Math.max(-9,b.x[1]); b.x[0]=Math.max(-5,Math.min(5,b.x[0]));
    PH.ballSq[i]=Math.max(0,PH.ballSq[i]-dt*4); });
  PH.cheek.forEach(c=>{ spring(c,175,6.5,dt); c.x[1]=Math.max(-6,Math.min(9,c.x[1])); c.x[0]=Math.max(-5,Math.min(5,c.x[0])); });
  PH.leg.forEach((l,i)=>{ l.v+=(-60*l.a-4.5*l.v)*dt; l.a=Math.max(-0.3,Math.min(0.3,l.a+l.v*dt)); });
}
let lastNow=null, acc=0, lutT=0;
function loop(now){
  const dt=lastNow===null?0:Math.min(0.05,Math.max(0,(now-lastNow)/1000)); lastNow=now;
  const i=GAME.tick(dt);
  { acc+=dt; while(acc>1/240){ physics(1/240,i); acc-=1/240; } PH.plap=Math.max(0,PH.plap-dt); }
  if((GAME.shinyOn()||GAME.rainbowOn()) && now-lutT>120){ lutT=now; setLUTs(); }
  { const fr=META.frames[i], gap=fr.mode==='slap'?10:fr.mode==='mid'?9:8.5, drop=fr.mode==='slap'?1:fr.mode==='mid'?2:3;
    gl.uniform4fv(U('uCheek'),[PH.cheek[0].x[0],PH.cheek[0].x[1],Math.max(-0.5,Math.min(1,PH.cheek[0].x[1]*0.12)),0, PH.cheek[1].x[0],PH.cheek[1].x[1],Math.max(-0.5,Math.min(1,PH.cheek[1].x[1]*0.12)),0]);
    gl.uniform4fv(U('uBall'),[160-gap,fr.by+drop,PH.ball[0].x[0],PH.ball[0].x[1], 160+gap,fr.by,PH.ball[1].x[0],PH.ball[1].x[1]]);
    gl.uniform4f(U('uSack'),fr.sackTop,PH.ballSq[0],PH.ballSq[1],0); gl.uniform4f(U('uLeg'),PH.leg[0].a,PH.leg[1].a,0,0); }
  // the lamp: a candle that wanders on its own, or follows the mouse
  const flick=0.92+0.08*Math.sin(now*0.023)+0.05*Math.sin(now*0.071);
  const lp=MOUSE||[230+Math.sin(now*0.0004)*30, 40+Math.cos(now*0.0005)*10];
  gl.uniform1i(U('uFrame'),i); gl.uniform3f(U('uLamp'),lp[0],lp[1],46); gl.uniform1f(U('uLampOn'),S.lamp?flick:0); gl.uniform1f(U('uPixel'),S.pixel?1:0); gl.uniform1f(U('uTime'),now/1000); gl.uniform1f(U('uSheen'),GAME.sheen());
  gl.viewport(0,0,320,180); gl.drawArrays(gl.TRIANGLES,0,3);
  // HUD
  hbuf.fill(0); const c=new Canvas2(hbuf,320,180);
  GAME.draw(c);
  hctx.putImageData(new ImageData(hbuf,320,180),0,0);
  requestAnimationFrame(loop);
}
// ------------------------------------------------------------ controls -----
const $=id=>document.getElementById(id);
const toHud=e=>{ const r=$('hud').getBoundingClientRect(); return [(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.height*180]; };
$('hud').addEventListener('pointerdown',e=>{ e.preventDefault(); const [x,y]=toHud(e); GAME.pointerDown(x,y); });
window.addEventListener('pointerup',()=>GAME.pointerUp());
$('hud').addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') MOUSE=toHud(e); });
$('hud').addEventListener('pointerleave',()=>{ MOUSE=null; });
window.addEventListener('keydown',e=>{ if(!$('modal').hidden) { if(e.code==='Escape') closePanel(); return; } GAME.key(e,true); });
window.addEventListener('keyup',e=>GAME.key(e,false));
// ------------------------------------------------------------ menus --------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let panelName=null;
function openPanel(n){ panelName=n; $('modal').hidden=false; renderPanel(); }
function closePanel(){ $('modal').hidden=true; panelName=null; }
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closePanel(); });
document.querySelectorAll('#bar button[data-panel]').forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));
function face(al){ const cv=document.createElement('canvas'); cv.width=34; cv.height=40; const buf=new Uint8ClampedArray(34*40*4); const c=new Canvas2(buf,34,40);
  GAME.portrait(c,0,0,{...al,kinsey:0,wigGone:true},4,performance.now()/1000); cv.getContext('2d').putImageData(new ImageData(buf,34,40),0,0); return cv; }
function renderPanel(){
  const G=GAME, S2=G.S, el=$('sheet'), f=G.fmt; let h='<button class="close" id="pClose">Close</button>';
  if(panelName==='shop'){
    h+=`<h2>Shop</h2><p class="sub"><span class="gold">${f(S2.pts)} points</span> · alumni earn ${G.passiveRate().toFixed(1)}/s</p>`;
    for(const [id,u] of Object.entries(G.UPGRADES)){ const lv=S2.upg[id], max=u.tiers?u.tiers.length-1:u.max, cost=u.tiers?u.cost[lv+1]:u.cost[lv];
      const now=u.tiers?u.tiers[lv]:(lv?'level '+lv:'not owned'), done=lv>=max;
      h+=`<div class="row"><div><b>${u.name}</b> <span class="dim">(${esc(now)})</span><small>${esc(u.desc)}</small></div>
        <button data-buy="${id}" ${done||S2.pts<cost?'disabled':''}>${done?'Maxed':(u.tiers?u.tiers[lv+1]+': ':'')+f(cost)}</button></div>`; }
    const d=new Date().toDateString()!==S2.daily;
    h+=`<div class="row"><div><b>Daily stubborn guy</b><small>A very stubborn guy, once a day. Pays 5x.</small></div><button id="pDaily" ${d?'':'disabled'}>${d?'Queue him':'Done today'}</button></div>`;
  }
  if(panelName==='lounge'){
    const n=S2.alumni.length;
    h+=`<h2>Bro Lounge</h2><p class="sub">${n} converted guys hanging out · earning <span class="gold">${G.passiveRate().toFixed(1)}/s</span>, even while you're away</p>`;
    const furn=[[1,'a beanbag'],[3,'a gaming chair'],[6,'sports on the TV'],[10,'a beer pong table'],[15,'a neon beer sign'],[25,'a fridge full of Monster']];
    h+=`<p class="sub">The lounge has ${furn.filter(x=>n>=x[0]).map(x=>x[1]).join(', ')||'nothing yet'}${n?`, and ${n*3} empty beer cans`:''}.</p><div class="grid" id="alGrid"></div>`;
    if(!n) h+='<p class="sub">Convert your first guy and he moves in here.</p>';
  }
  if(panelName==='city'){
    const c=G.cityOf(S2.tier), bossIn=Math.max(0,G.BOSS_AFTER-S2.cityConv);
    h+=`<h2>${esc(c.name)}</h2><p class="sub">City ${S2.tier+1} · boss: <b>${esc(c.boss)}</b> (${esc(c.title)})</p>`;
    h+=`<div class="row"><div><b>Boss</b><small>${S2.bossBeaten?'<span class="ok">Beaten. You can rebirth.</span>':bossIn?`Shows up after ${bossIn} more conversions here.`:'He is up next. Good luck.'}</small></div></div>`;
    h+=`<div class="row"><div><b>Rebirth: The Straight Agenda</b><small>Move to a gayer city. Resets points, upgrades and alumni. Pays <span class="gold">${G.flannelNow()} Flannel</span> (from ${S2.runConv} conversions this run).</small></div><button id="pReb" ${S2.bossBeaten?'':'disabled'}>Rebirth</button></div>`;
    h+=`<h2 style="margin-top:12px">Perks</h2><p class="sub"><span class="gold">${S2.flannel} Flannel</span> · permanent, they survive rebirths</p>`;
    for(const [id,p] of Object.entries(G.PERKS)) h+=`<div class="row"><div><b>${p.name}</b><small>${esc(p.desc)}</small></div><button data-perk="${id}" ${S2.perks[id]||S2.flannel<p.cost?'disabled':''}>${S2.perks[id]?'Owned':p.cost+' Flannel'}</button></div>`;
    h+=`<p class="sub" style="margin-top:10px">Route: ${G.CITIES.map((x,i)=>i<S2.tier?`<s>${esc(x.name)}</s>`:i===S2.tier?`<b>${esc(x.name)}</b>`:esc(x.name)).join(' → ')} → endless Pride Parade</p>`;
  }
  if(panelName==='trophies'){
    const got=Object.keys(S2.ach).length;
    h+=`<h2>Trophies</h2><p class="sub">${got} of ${Object.keys(G.ACH).length}</p>`;
    for(const [id,[n,d]] of Object.entries(G.ACH)) h+=`<div class="row"><div><b class="${S2.ach[id]?'gold':'dim'}">${n}</b><small>${esc(d)}</small></div><span class="${S2.ach[id]?'ok':'dim'}">${S2.ach[id]?'Unlocked':'Locked'}</span></div>`;
  }
  if(panelName==='stats'){
    const st=S2.stats, rows=[['Guys converted',st.conv],['Creampies',st.creampies],['Condoms filled',st.condoms],['Litres',st.litres.toFixed(2)],['Beds broken',st.beds],['Times someone said "no homo"',st.nohomo],['Perfect hits',st.perfects],['Mega nuts',st.megas],['Condoms swept',st.swept],['Best combo',st.bestCombo],['Chaos handled',st.events],['Time played',Math.floor(st.time/60)+' min']];
    h+='<h2>Stats</h2>'+rows.map(([a,b])=>`<div class="row"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('');
  }
  if(panelName==='settings'){
    const o=(k,v,label)=>`<button data-set="${k}" data-val="${v}" class="${S2.settings[k]===v?'on':''}">${label}</button>`;
    h+=`<h2>Settings</h2>
      <div class="row"><span>Shading</span><span>${o('pixel',false,'Smooth')} ${o('pixel',true,'Pixel bands')}</span></div>
      <div class="row"><span>Palette</span><span>${o('gray',false,'Color')} ${o('gray',true,'Grayscale + pink')}</span></div>
      <div class="row"><span>Candle light</span><span>${o('lamp',true,'On')} ${o('lamp',false,'Off')}</span></div>
      <div class="row"><span>Climax</span><span>${o('climax','creampie','Creampie')} ${o('climax','condom','Condom')}</span></div>
      <div class="row"><span>Sound and music</span><span>${o('sound',false,'Off')} ${o('sound',true,'On')}</span></div>
      <div class="row"><span>Mirror Mode (S2G)</span><span class="dim">${S2.perks.mirror?'Coming soon':'Needs the Mirror Mode perk'}</span></div>
      <div class="row"><span>Wipe save</span><button id="pWipe">Start over</button></div>`;
  }
  el.innerHTML=h;
  $('pClose').onclick=closePanel;
  el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{ G.buy(b.dataset.buy); renderPanel(); });
  el.querySelectorAll('[data-perk]').forEach(b=>b.onclick=()=>{ G.buyPerk(b.dataset.perk); renderPanel(); });
  el.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{ const v=b.dataset.val; S2.settings[b.dataset.set]=v==='true'?true:v==='false'?false:v; G.save(); if(b.dataset.set==='gray') setLUTs(); if(b.dataset.set==='sound'&&S2.settings.sound) G.unlockAudio(); renderPanel(); });
  if($('pDaily')) $('pDaily').onclick=()=>{ G.daily(); renderPanel(); };
  if($('pReb')) $('pReb').onclick=()=>{ G.rebirth(); closePanel(); };
  if($('pWipe')) $('pWipe').onclick=()=>{ if($('pWipe').dataset.sure){ G.reset(); } else { $('pWipe').dataset.sure=1; $('pWipe').textContent='Tap again to wipe everything'; } };
  if($('alGrid')) S2.alumni.slice().reverse().forEach(al=>{ const d=document.createElement('div'); d.className='al'; d.appendChild(face(al));
    const r=G.RARITY[al.rar]; const t=document.createElement('div');
    t.innerHTML=`<b>${esc(al.name)}</b><br><span class="dim">${esc(G.ARCH[al.arch].name.toLowerCase())}</span> · <span style="color:rgb(${r[3].join(',')})">${(al.shiny?'shiny ':'')+r[0].toLowerCase()}</span><br><span class="gold">${G.JOBS_ALUMNI[al.job][0].toLowerCase()}</span><br>now enjoys ${esc(al.enjoys.join(', '))}`;
    d.appendChild(t); $('alGrid').appendChild(d); });
}
window.__G=GAME;
boot();
</script>
