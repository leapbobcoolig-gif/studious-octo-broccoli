  return { name:r(FIRST)+' '+r(LAST), age:19+Math.floor(Math.random()*16), bio:r(BIOS), tone:r(TONES), kinsey:6, arousal:0 }; }

// ---------------------------------------------------------------- state ----
let META;
const S={ pixel:false, gray:false, lampMode:'wander', mouse:null, sound:false, lube:0, lubeCd:0 };
const G={ score:0, combo:0, best:0, converted:0, lover:newLover(), judge:null, judgeT:0, plapT:0, card:5, done:0, lastTap:-9 };
try{ const s=JSON.parse(localStorage.getItem('sub_save')||'{}'); if(s.score) G.score=s.score; if(s.converted) G.converted=s.converted; if(s.best) G.best=s.best; }catch(e){}
function save(){ try{ localStorage.setItem('sub_save',JSON.stringify({score:G.score,converted:G.converted,best:G.best})); }catch(e){} }

// -------------------------------------------------------------- physics ----
// springs are 2D offsets in screen pixels, kicked by the slam and by the sprite's own motion
const spr=()=>({x:[0,0],v:[0,0]});
const PH={ cheek:[spr(),spr()], ball:[spr(),spr()], ballSq:[0,0], leg:[{a:0,v:0},{a:0,v:0}], glute:spr(), flush:0, power:1, prevBy:null, prevByV:0 };
function spring(o,k,c,dt,ax=0,ay=0){ for(let i=0;i<2;i++){ const f=-k*o.x[i]-c*o.v[i]-(i?ay:ax); o.v[i]+=f*dt; o.x[i]+=o.v[i]*dt; } }
function slam(){
  const pw=PH.power*(S.lube>0?1.15:1);
  PH.cheek.forEach((c,i)=>{ c.v[0]+=(i?1:-1)*28*pw; c.v[1]+=70*pw; });
  PH.leg.forEach((l,i)=>{ l.v+=(i?1:-1)*1.0*pw*(0.8+Math.random()*0.4); });
  PH.glute.v[1]+=40*pw;
  PH.ball.forEach((b,i)=>{ b.v[0]+=(Math.random()-0.5)*40*pw; });
  PH.flush=Math.min(1,PH.flush+0.1*pw);
  squelch();
  PH.power=Math.max(0.8,PH.power*0.55);
}
function physics(dt, f){
  const fr=META.frames[f];
  // the sack's sprite anchor jumps frame to frame; the balls lag behind each jump, then swing
  const by=fr.by; if(PH.prevBy===null) PH.prevBy=by;
  const dBy=by-PH.prevBy; PH.prevBy=by;
  PH.ball.forEach((b,i)=>{ if(dBy){ b.x[1]-=dBy*(0.55+i*0.1); b.v[1]-=dBy*4; }
    spring(b,95,3.2,dt);
    // they can't sink into her: at the slam the bottom of the sack sits on her taint
    const floor=fr.mode==='slap'?1.5:fr.mode==='mid'?4:6;
    if(b.x[1]>floor){ const hit=b.v[1]; b.x[1]=floor; if(hit>0){ b.v[1]=-hit*0.35; if(hit>60){ PH.ballSq[i]=Math.min(1,hit/260); if(i===0) plap(hit); PH.cheek.forEach(c=>c.v[1]+=hit*0.12); } } }
    if(b.x[1]<-14) { b.x[1]=-14; b.v[1]=Math.abs(b.v[1])*0.3; }
    b.x[0]=Math.max(-5,Math.min(5,b.x[0])); b.x[1]=Math.max(-9,b.x[1]);
    PH.ballSq[i]=Math.max(0,PH.ballSq[i]-dt*4); });
  PH.cheek.forEach(c=>spring(c,175,6.5,dt));
  PH.cheek.forEach(c=>{ c.x[1]=Math.max(-6,Math.min(9,c.x[1])); c.x[0]=Math.max(-5,Math.min(5,c.x[0])); });
  PH.leg.forEach((l,i)=>{ const f=-60*l.a-4.5*l.v+Math.sin(clock*1.3+i)*0.4; l.v+=f*dt; l.a+=l.v*dt; l.a=Math.max(-0.35,Math.min(0.35,l.a)); });
  spring(PH.glute,380,12,dt);
  PH.flush=Math.max(0,PH.flush-dt*0.03);
}

// ------------------------------------------------------------------ audio ---
let AC=null;
function plap(v){ G.plapT=0.35; if(!S.sound||!AC) return;
  const t=AC.currentTime, len=0.12, buf=AC.createBuffer(1,Math.floor(AC.sampleRate*len),AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ const x=i/d.length; d[i]=(Math.random()*2-1)*Math.pow(1-x,6)+Math.sin(i/AC.sampleRate*2*Math.PI*90)*Math.pow(1-x,3)*0.8; }
  const src=AC.createBufferSource(); src.buffer=buf; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900+Math.min(v,300)*5;
  const g=AC.createGain(); g.gain.value=Math.min(0.9,0.25+v/500); src.connect(f).connect(g).connect(AC.destination); src.start(t); }
function squelch(){ if(!S.sound||!AC) return; const t=AC.currentTime, len=0.18, buf=AC.createBuffer(1,Math.floor(AC.sampleRate*len),AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ const x=i/d.length; d[i]=(Math.random()*2-1)*Math.sin(x*Math.PI)*0.5; }
  const src=AC.createBufferSource(); src.buffer=buf; const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=6; f.frequency.setValueAtTime(500,t); f.frequency.exponentialRampToValueAtTime(1600,t+len);
  const g=AC.createGain(); g.gain.value=0.3; src.connect(f).connect(g).connect(AC.destination); src.start(t); }

// ------------------------------------------------------------------- game ---
// the loop: frame 3 is the slam. Speed rises as his Kinsey drops.
const SLAM=3;
let clock=0, loopT=0, curFrame=0, lastSlamAt=-9;
function speed(){ return 0.62+(6-G.lover.kinsey)*0.11; }
function loopLen(){ return META.frames.reduce((a,f)=>a+f.ms,0)/1000/speed(); }
function frameAt(t){ const F=META.frames; let x=t*speed()*1000, i=0; while(i<F.length-1 && x>=F[i].ms){ x-=F[i].ms; i++; } return i; }
function slamOffset(){ return META.frames.slice(0,SLAM).reduce((a,f)=>a+f.ms,0)/1000/speed(); }
function judgeTap(){
  if(G.done) return;
  G.lastTap=clock;
  const L=loopLen(), toNext=((slamOffset()-loopT)%L+L)%L, since=clock-lastSlamAt;
  const off=Math.min(toNext,since), win=S.lube>0?1.6:1;
  let j, gain;
  if(off<0.06*win){ j='PERFECT!'; gain=10; } else if(off<0.13*win){ j='GOOD'; gain=6; } else { j='MISS'; gain=-4; }
  if(gain>0){ G.combo++; PH.power=gain>8?1.8:1.4; if(since<toNext){ PH.cheek.forEach(c=>c.v[1]+=30); PH.leg.forEach((l,i)=>l.v+=(i?1:-1)*0.4); } }
  else G.combo=0;
  G.best=Math.max(G.best,G.combo);
  const mult=1+Math.min(G.combo,40)*0.05+G.converted*0.25;
  G.score+=Math.max(0,Math.round(gain*mult));
  const Lv=G.lover; Lv.arousal=Math.max(0,Math.min(100,Lv.arousal+gain*(1+G.combo*0.02)*(1+G.converted*0.1)));
  if(Lv.arousal>=100){ Lv.kinsey--; Lv.arousal=0; G.judge='KINSEY '+Lv.kinsey+'!'; G.judgeT=1.4; if(Lv.kinsey<=0){ G.done=1; G.converted++; G.score+=500*G.converted; } save(); return; }
  G.judge=j; G.judgeT=0.6;
}
function nextLover(){ G.lover=newLover(); G.done=0; G.card=5; G.combo=0; setLUTs(); save(); }

// ------------------------------------------------------------------- draw ---
const hud=document.getElementById('hud'), hctx=hud.getContext('2d'), hbuf=new Uint8ClampedArray(W*H*4);
const C={ink:[26,15,30],paper:[255,246,234],uiD:[43,27,51],uiM:[91,68,112],heart:[255,111,145],blush:[255,125,154],brow:[58,39,33]};
function wrapText(s,n){ const w=s.toUpperCase().split(' '), out=[]; let l=''; for(const x of w){ if((l+' '+x).trim().length>n){ out.push(l.trim()); l=x; } else l+=' '+x; } if(l.trim()) out.push(l.trim()); return out; }
function drawHUD(dt){
  hbuf.fill(0); const c=new Canvas2(hbuf,W,H), L=G.lover;
  c.rect(0,3,74,10,C.uiD); c.text('SCORE '+G.score,4,6,C.paper);
  if(G.combo>1) c.textOutlined('X'+G.combo+' COMBO',4,17,C.paper,C.ink);
  const kx=W-80, ky=4; c.rect(kx-3,ky-2,80,26,C.uiD);
  c.text('KINSEY',kx,ky,C.paper); c.text(String(L.kinsey),kx+68,ky,C.heart);
  for(let i=0;i<6;i++){ const lit=i<6-L.kinsey; c.rect(kx+i*12,ky+8,10,5,lit?C.heart:C.uiM); if(!lit) c.rect(kx+i*12+1,ky+9,8,3,C.uiD); }
  c.rect(kx,ky+16,72,4,C.ink); c.rect(kx,ky+16,Math.round(72*L.arousal/100),4,[255,190,120]);
  const Lp=loopLen(), toNext=((slamOffset()-loopT)%Lp+Lp)%Lp/Lp;
  UI.rhythm(c,160,96,toNext<0.8?toNext/0.8:0,C,null);
  if(G.judgeT>0){ G.judgeT-=dt; const j=G.judge; c.textOutlined(j,Math.round(160-j.length*2),64,j==='MISS'?[190,170,200]:C.paper,C.ink); }
  if(G.plapT>0){ G.plapT-=dt; if(G.plapT>0.12) c.textOutlined('PLAP!',196,106,C.paper,C.ink); }
  const lines=UI.LINES[L.kinsey]||UI.LINES[3]; UI.speech(c,5,150,lines[Math.floor(clock/4)%lines.length],C);
  if(G.card>0 && !G.done){ G.card-=dt; const bx=96, by=38, bio=wrapText(L.bio,28);
    c.rect(bx,by,128,34+bio.length*7,C.ink); c.rect(bx+1,by+1,126,32+bio.length*7,C.uiD);
    c.text('NEW LOVER',bx+5,by+5,C.heart); c.text(L.name+', '+L.age,bx+5,by+14,C.paper); c.text('KINSEY 6',bx+5,by+21,[170,148,192]);
    bio.forEach((l,i)=>c.text(l,bx+5,by+30+i*7,C.paper)); }
  if(G.done){ const bx=82, by=48; c.rect(bx,by,156,52,C.ink); c.rect(bx+1,by+1,154,50,C.uiD);
    c.textOutlined('CONVERTED!',bx+58,by+6,C.heart,C.ink); c.text(L.name.split(' ')[0]+' IS STRAIGHT NOW.',bx+6,by+18,C.paper);
    c.text('LOVERS CONVERTED: '+G.converted,bx+6,by+26,C.paper); c.text('BEST COMBO: '+G.best,bx+6,by+33,C.paper);
    c.rect(bx+40,by+40,76,9,C.heart); c.text('TAP: NEXT LOVER',bx+44,by+42,C.ink); }
  if(S.lube>0) c.text('LUBE '+Math.ceil(S.lube),W-40,H-10,[150,200,255]);
  hctx.putImageData(new ImageData(hbuf,W,H),0,0);
}
function setLUTs(){ const L=buildLUTs(S.gray,G.lover.tone); tex(3,256,1,L.lut); tex(4,256,1,L.lineCol); tex(5,RAMP_N*16,1,L.ramp);
  gl.useProgram(prog); gl.uniform4fv(U.uMP,L.mp); }
let prev=performance.now(), acc=0;
function update(dt){
  clock+=dt;
  const Lp=loopLen(); const before=loopT; loopT=(loopT+dt)%Lp;
  const f=frameAt(loopT);
  const so=slamOffset(); if((before<so && loopT>=so) || (loopT<before && so<=loopT)){ lastSlamAt=clock; slam(); }
  curFrame=f;
  acc+=dt; const step=1/240; while(acc>step){ physics(step,f); acc-=step; }
  if(S.lube>0) S.lube=Math.max(0,S.lube-dt); if(S.lubeCd>0) S.lubeCd=Math.max(0,S.lubeCd-dt);
  setBtn('bLube','Lube',S.lube>0?'on':S.lubeCd>0?Math.ceil(S.lubeCd)+'s':'ready');
}
function render(now){
  const dt=Math.max(0,Math.min(0.05,(now-prev)/1000)); prev=now;
  update(dt); draw(now,dt);
  if(!window.__manual) requestAnimationFrame(render);
}
function draw(now,dt){
  const f=curFrame;
  const flick=0.92+0.06*Math.sin(now*0.021)+0.04*Math.sin(now*0.067)+0.02*Math.sin(now*0.17);
  const lp=(S.lampMode==='mouse'&&S.mouse)?S.mouse:[95+Math.sin(now*0.00033)*45, 22+Math.cos(now*0.00051)*16];
  const fr=META.frames[f];
  gl.useProgram(prog); gl.bindFramebuffer(gl.FRAMEBUFFER,fbo); gl.viewport(0,0,W,H);
  gl.uniform1i(U.uFrame,f); gl.uniform4f(U.uLamp,lp[0],lp[1],80,1.5*flick);
  gl.uniform4fv(U.uCheek,[PH.cheek[0].x[0],PH.cheek[0].x[1],Math.max(-0.5,Math.min(1,PH.cheek[0].x[1]*0.12)),0, PH.cheek[1].x[0],PH.cheek[1].x[1],Math.max(-0.5,Math.min(1,PH.cheek[1].x[1]*0.12)),0]);
  const gap=fr.mode==='slap'?10.5:fr.mode==='mid'?9.5:9, drop=fr.mode==='slap'?1:fr.mode==='mid'?2:3;
  gl.uniform4fv(U.uBall,[160-gap,fr.by+drop,PH.ball[0].x[0],PH.ball[0].x[1], 160+gap,fr.by,PH.ball[1].x[0],PH.ball[1].x[1]]);
  gl.uniform4f(U.uSack,fr.sackTop,PH.ballSq[0],PH.ballSq[1],S.lube>0?1:0);
  gl.uniform4f(U.uLeg,PH.leg[0].a,PH.leg[1].a,0,0);
  gl.uniform4f(U.uGlute,PH.glute.x[0],PH.glute.x[1],fr.sackTop-21,PH.flush);
  gl.uniform1f(U.uPixel,S.pixel?1:0); gl.uniform1f(U.uGray,S.gray?1:0); gl.uniform1f(U.uTime,now/1000);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.useProgram(post); gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
  gl.activeTexture(gl.TEXTURE6); gl.bindTexture(gl.TEXTURE_2D,fboTex); gl.uniform1i(UP.uSrc,6);
  gl.drawArrays(gl.TRIANGLES,0,3);
  drawHUD(dt);
}
// --------------------------------------------------------------- controls ---
const $=id=>document.getElementById(id);
function setBtn(id,label,val){ const b=$(id); const s=label+' <b>'+val+'</b>'; if(b.innerHTML!==s) b.innerHTML=s; }
$('bLight').onclick=()=>{ S.pixel=!S.pixel; setBtn('bLight','Shading',S.pixel?'pixel':'smooth'); };
$('bPal').onclick=()=>{ S.gray=!S.gray; setBtn('bPal','Palette',S.gray?'grayscale':'color'); setLUTs(); };
$('bLamp').onclick=()=>{ S.lampMode=S.lampMode==='wander'?'mouse':'wander'; setBtn('bLamp','Candle',S.lampMode==='mouse'?'follows pointer':'wander'); };
$('bLube').onclick=()=>{ if(S.lubeCd>0) return; S.lube=10; S.lubeCd=25; };
$('bSnd').onclick=()=>{ S.sound=!S.sound; if(S.sound&&!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ S.sound=false; } } setBtn('bSnd','Sound',S.sound?'on':'off'); };
function tap(){ if(G.done){ nextLover(); return; } judgeTap(); }
$('hud').addEventListener('pointerdown',e=>{ e.preventDefault(); tap(); });
$('hud').addEventListener('pointermove',e=>{ const r=e.target.getBoundingClientRect(); S.mouse=[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]; });
window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); tap(); } });
async function boot(){
  try{
    boot3d();
    const [mat,nrm,room,meta]=await Promise.all([loadImg(ASSETS.mat),loadImg(ASSETS.nrm),loadImg(ASSETS.room), typeof ASSETS.meta==='string'?fetch(ASSETS.meta).then(r=>r.json()):ASSETS.meta]);
    META=meta;
    tex(0,0,0,mat); tex(1,0,0,nrm); tex(2,0,0,room); setLUTs();
    gl.useProgram(prog); gl.uniform1i(U.uMat,0); gl.uniform1i(U.uNrm,1); gl.uniform1i(U.uRoom,2); gl.uniform1i(U.uLut,3); gl.uniform1i(U.uLine,4); gl.uniform1i(U.uRamp,5);
    window.__S=S; window.__G=G; window.__PH=PH; window.__render=render; window.__TONES=TONES; window.__setLUTs=setLUTs; window.__update=update; window.__draw=draw; window.__state=()=>({loopT,curFrame,clock}); window.__ready=true;
    requestAnimationFrame(render);
  }catch(e){ const el=$('err'); el.hidden=false; el.textContent=e.message; console.error(e); }
}
boot();
</script>
