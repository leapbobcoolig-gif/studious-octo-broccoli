<style>:root{color-scheme:dark}</style>

<style>
  :root{ --bg:#0d0a12; --panel:#1c1426; --ink:#f4e9f2; --accent:#ff5c8a; }
  html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.3 ui-monospace,Menlo,monospace}
  #wrap{position:relative;width:min(100vw,177.7vh);margin:0 auto}
  canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
  #hud{position:absolute;inset:0}
  #bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px}
  button,label{background:var(--panel);color:var(--ink);border:1px solid #3b2b4d;border-radius:4px;padding:5px 9px;font:inherit;cursor:pointer}
  button.on{border-color:var(--accent);color:var(--accent)}
  input[type=range]{vertical-align:middle}
  #wrap{touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #modal{position:fixed;inset:0;background:rgba(8,5,12,.82);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:5}
  #modal[hidden]{display:none}
  #sheet{background:#1c1426;border:2px solid #3b2b4d;border-radius:6px;max-width:640px;width:100%;padding:14px 16px;box-sizing:border-box}
  #sheet h2{margin:0 0 4px;font-size:16px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
  #sheet .sub{color:#a691b0;margin:0 0 10px}
  #sheet .row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid #2e2240}
  #sheet .row b{color:#fff}
  #sheet .row small{color:#a691b0;display:block}
  #sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  #sheet .al{background:#251b33;border:1px solid #3b2b4d;border-radius:4px;padding:6px;display:flex;gap:6px;min-width:0}
  #sheet .al canvas{width:51px;height:60px;image-rendering:pixelated;flex:none}
  #sheet .al div{min-width:0;font-size:11px;line-height:1.35}
  #sheet .gold{color:#ffce5c} #sheet .ok{color:#78dc8c} #sheet .dim{color:#6f5c80}
  #sheet .close{float:right}
  #sheet button[disabled]{opacity:.45;cursor:default}
</style>

// 2D springs in screen pixels. The slam (frame 3) kicks her cheeks, legs and his balls;
// the balls also lag behind every jump of the sprite's own sack position, then swing back.
const spr=()=>({x:[0,0],v:[0,0]});
const PH={ cheek:[spr(),spr()], ball:[spr(),spr()], ballSq:[0,0], leg:[{a:0,v:0},{a:0,v:0}], prevFrame:-1, prevBy:null, t:0, plap:0 };
function spring(o,k,c,dt){ for(let i=0;i<2;i++){ o.v[i]+=(-k*o.x[i]-c*o.v[i])*dt; o.x[i]+=o.v[i]*dt; } }
function slam(power){
  PH.cheek.forEach((c,i)=>{ c.v[0]+=(i?1:-1)*26*power; c.v[1]+=72*power; });
  PH.leg.forEach((l,i)=>{ l.v+=(i?1:-1)*1.1*power*(0.8+Math.random()*0.4); });
  PH.ball.forEach(b=>{ b.v[0]+=(Math.random()-0.5)*36*power; });
}
function physics(dt,f){
  const fr=META.frames[f];
  if(f!==PH.prevFrame){ if(f===3) slam(GAME.power()); PH.prevFrame=f; }
  if(PH.prevBy===null) PH.prevBy=fr.by;
  const dBy=fr.by-PH.prevBy; PH.prevBy=fr.by;
  PH.ball.forEach((b,i)=>{ if(dBy){ b.x[1]-=dBy*(0.55+i*0.1); b.v[1]-=dBy*4; }
    spring(b,95,3.2,dt);
    const floor=fr.mode==='slap'?1.5:fr.mode==='mid'?4:6;          // the sack can't sink into her
    if(b.x[1]>floor){ const hit=b.v[1]; b.x[1]=floor; if(hit>0){ b.v[1]=-hit*0.35; if(hit>60){ PH.ballSq[i]=Math.min(1,hit/260); PH.plap=0.3; PH.cheek.forEach(c=>c.v[1]+=hit*0.12); } } }
    b.x[1]=Math.max(-9,b.x[1]); b.x[0]=Math.max(-5,Math.min(5,b.x[0]));
    PH.ballSq[i]=Math.max(0,PH.ballSq[i]-dt*4); });
  PH.cheek.forEach(c=>{ spring(c,175,6.5,dt); c.x[1]=Math.max(-6,Math.min(9,c.x[1])); c.x[0]=Math.max(-5,Math.min(5,c.x[0])); });
  PH.leg.forEach((l,i)=>{ l.v+=(-60*l.a-4.5*l.v)*dt; l.a=Math.max(-0.3,Math.min(0.3,l.a+l.v*dt)); });
}
let lastNow=null, acc=0, lutT=0;
function loop(now){
  const dt=lastNow===null?0:Math.min(0.05,Math.max(0,(now-lastNow)/1000)); lastNow=now;
  const i=GAME.tick(dt);
  { acc+=dt; while(acc>1/240){ physics(1/240,i); acc-=1/240; } PH.plap=Math.max(0,PH.plap-dt); }
  if((GAME.shinyOn()||GAME.rainbowOn()) && now-lutT>120){ lutT=now; setLUTs(); }
  { const fr=META.frames[i], gap=fr.mode==='slap'?10:fr.mode==='mid'?9:8.5, drop=fr.mode==='slap'?1:fr.mode==='mid'?2:3;
    gl.uniform4fv(U('uCheek'),[PH.cheek[0].x[0],PH.cheek[0].x[1],Math.max(-0.5,Math.min(1,PH.cheek[0].x[1]*0.12)),0, PH.cheek[1].x[0],PH.cheek[1].x[1],Math.max(-0.5,Math.min(1,PH.cheek[1].x[1]*0.12)),0]);
    gl.uniform4fv(U('uBall'),[160-gap,fr.by+drop,PH.ball[0].x[0],PH.ball[0].x[1], 160+gap,fr.by,PH.ball[1].x[0],PH.ball[1].x[1]]);
    gl.uniform4f(U('uSack'),fr.sackTop,PH.ballSq[0],PH.ballSq[1],0); gl.uniform4f(U('uLeg'),PH.leg[0].a,PH.leg[1].a,0,0); }
  // the lamp: a candle that wanders on its own, or follows the mouse
  const flick=0.92+0.08*Math.sin(now*0.023)+0.05*Math.sin(now*0.071);
  const lp=MOUSE||[230+Math.sin(now*0.0004)*30, 40+Math.cos(now*0.0005)*10];
  gl.uniform1i(U('uFrame'),i); gl.uniform3f(U('uLamp'),lp[0],lp[1],46); gl.uniform1f(U('uLampOn'),S.lamp?flick:0); gl.uniform1f(U('uPixel'),S.pixel?1:0); gl.uniform1f(U('uTime'),now/1000); gl.uniform1f(U('uSheen'),GAME.sheen());
  gl.viewport(0,0,320,180); gl.drawArrays(gl.TRIANGLES,0,3);
  // HUD
  hbuf.fill(0); const c=new Canvas2(hbuf,320,180);
  GAME.draw(c);
  hctx.putImageData(new ImageData(hbuf,320,180),0,0);
  requestAnimationFrame(loop);
}
// ------------------------------------------------------------ controls -----
const $=id=>document.getElementById(id);
const toHud=e=>{ const r=$('hud').getBoundingClientRect(); return [(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.height*180]; };
$('hud').addEventListener('pointerdown',e=>{ e.preventDefault(); const [x,y]=toHud(e); GAME.pointerDown(x,y); });
window.addEventListener('pointerup',()=>GAME.pointerUp());
$('hud').addEventListener('pointermove',e=>{ if(e.pointerType==='mouse') MOUSE=toHud(e); });
$('hud').addEventListener('pointerleave',()=>{ MOUSE=null; });
window.addEventListener('keydown',e=>{ if(!$('modal').hidden) { if(e.code==='Escape') closePanel(); return; } GAME.key(e,true); });
window.addEventListener('keyup',e=>GAME.key(e,false));
// ------------------------------------------------------------ menus --------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let panelName=null;
function openPanel(n){ panelName=n; $('modal').hidden=false; renderPanel(); }
function closePanel(){ $('modal').hidden=true; panelName=null; }
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closePanel(); });
document.querySelectorAll('#bar button[data-panel]').forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));
function face(al){ const cv=document.createElement('canvas'); cv.width=34; cv.height=40; const buf=new Uint8ClampedArray(34*40*4); const c=new Canvas2(buf,34,40);
  GAME.portrait(c,0,0,{...al,kinsey:0,wigGone:true},4,performance.now()/1000); cv.getContext('2d').putImageData(new ImageData(buf,34,40),0,0); return cv; }
function renderPanel(){
  const G=GAME, S2=G.S, el=$('sheet'), f=G.fmt; let h='<button class="close" id="pClose">Close</button>';
  if(panelName==='shop'){
    h+=`<h2>Shop</h2><p class="sub"><span class="gold">${f(S2.pts)} points</span> · alumni earn ${G.passiveRate().toFixed(1)}/s</p>`;
    for(const [id,u] of Object.entries(G.UPGRADES)){ const lv=S2.upg[id], max=u.tiers?u.tiers.length-1:u.max, cost=u.tiers?u.cost[lv+1]:u.cost[lv];
      const now=u.tiers?u.tiers[lv]:(lv?'level '+lv:'not owned'), done=lv>=max;
      h+=`<div class="row"><div><b>${u.name}</b> <span class="dim">(${esc(now)})</span><small>${esc(u.desc)}</small></div>
        <button data-buy="${id}" ${done||S2.pts<cost?'disabled':''}>${done?'Maxed':(u.tiers?u.tiers[lv+1]+': ':'')+f(cost)}</button></div>`; }
    const d=new Date().toDateString()!==S2.daily;
    h+=`<div class="row"><div><b>Daily stubborn guy</b><small>A very stubborn guy, once a day. Pays 5x.</small></div><button id="pDaily" ${d?'':'disabled'}>${d?'Queue him':'Done today'}</button></div>`;
  }
  if(panelName==='lounge'){
    const n=S2.alumni.length;
    h+=`<h2>Bro Lounge</h2><p class="sub">${n} converted guys hanging out · earning <span class="gold">${G.passiveRate().toFixed(1)}/s</span>, even while you're away</p>`;
    const furn=[[1,'a beanbag'],[3,'a gaming chair'],[6,'sports on the TV'],[10,'a beer pong table'],[15,'a neon beer sign'],[25,'a fridge full of Monster']];
    h+=`<p class="sub">The lounge has ${furn.filter(x=>n>=x[0]).map(x=>x[1]).join(', ')||'nothing yet'}${n?`, and ${n*3} empty beer cans`:''}.</p><div class="grid" id="alGrid"></div>`;
    if(!n) h+='<p class="sub">Convert your first guy and he moves in here.</p>';
  }
  if(panelName==='city'){
    const c=G.cityOf(S2.tier), bossIn=Math.max(0,G.BOSS_AFTER-S2.cityConv);
    h+=`<h2>${esc(c.name)}</h2><p class="sub">City ${S2.tier+1} · boss: <b>${esc(c.boss)}</b> (${esc(c.title)})</p>`;
    h+=`<div class="row"><div><b>Boss</b><small>${S2.bossBeaten?'<span class="ok">Beaten. You can rebirth.</span>':bossIn?`Shows up after ${bossIn} more conversions here.`:'He is up next. Good luck.'}</small></div></div>`;
    h+=`<div class="row"><div><b>Rebirth: The Straight Agenda</b><small>Move to a gayer city. Resets points, upgrades and alumni. Pays <span class="gold">${G.flannelNow()} Flannel</span> (from ${S2.runConv} conversions this run).</small></div><button id="pReb" ${S2.bossBeaten?'':'disabled'}>Rebirth</button></div>`;
    h+=`<h2 style="margin-top:12px">Perks</h2><p class="sub"><span class="gold">${S2.flannel} Flannel</span> · permanent, they survive rebirths</p>`;
    for(const [id,p] of Object.entries(G.PERKS)) h+=`<div class="row"><div><b>${p.name}</b><small>${esc(p.desc)}</small></div><button data-perk="${id}" ${S2.perks[id]||S2.flannel<p.cost?'disabled':''}>${S2.perks[id]?'Owned':p.cost+' Flannel'}</button></div>`;
    h+=`<p class="sub" style="margin-top:10px">Route: ${G.CITIES.map((x,i)=>i<S2.tier?`<s>${esc(x.name)}</s>`:i===S2.tier?`<b>${esc(x.name)}</b>`:esc(x.name)).join(' → ')} → endless Pride Parade</p>`;
  }
  if(panelName==='trophies'){
    const got=Object.keys(S2.ach).length;
    h+=`<h2>Trophies</h2><p class="sub">${got} of ${Object.keys(G.ACH).length}</p>`;
    for(const [id,[n,d]] of Object.entries(G.ACH)) h+=`<div class="row"><div><b class="${S2.ach[id]?'gold':'dim'}">${n}</b><small>${esc(d)}</small></div><span class="${S2.ach[id]?'ok':'dim'}">${S2.ach[id]?'Unlocked':'Locked'}</span></div>`;
  }
  if(panelName==='stats'){
    const st=S2.stats, rows=[['Guys converted',st.conv],['Creampies',st.creampies],['Condoms filled',st.condoms],['Litres',st.litres.toFixed(2)],['Beds broken',st.beds],['Times someone said "no homo"',st.nohomo],['Perfect hits',st.perfects],['Mega nuts',st.megas],['Condoms swept',st.swept],['Best combo',st.bestCombo],['Chaos handled',st.events],['Time played',Math.floor(st.time/60)+' min']];
    h+='<h2>Stats</h2>'+rows.map(([a,b])=>`<div class="row"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('');
  }
  if(panelName==='settings'){
    const o=(k,v,label)=>`<button data-set="${k}" data-val="${v}" class="${S2.settings[k]===v?'on':''}">${label}</button>`;
    h+=`<h2>Settings</h2>
      <div class="row"><span>Shading</span><span>${o('pixel',false,'Smooth')} ${o('pixel',true,'Pixel bands')}</span></div>
      <div class="row"><span>Palette</span><span>${o('gray',false,'Color')} ${o('gray',true,'Grayscale + pink')}</span></div>
      <div class="row"><span>Candle light</span><span>${o('lamp',true,'On')} ${o('lamp',false,'Off')}</span></div>
      <div class="row"><span>Climax</span><span>${o('climax','creampie','Creampie')} ${o('climax','condom','Condom')}</span></div>
      <div class="row"><span>Sound and music</span><span>${o('sound',false,'Off')} ${o('sound',true,'On')}</span></div>
      <div class="row"><span>Mirror Mode (S2G)</span><span class="dim">${S2.perks.mirror?'Coming soon':'Needs the Mirror Mode perk'}</span></div>
      <div class="row"><span>Wipe save</span><button id="pWipe">Start over</button></div>`;
  }
  el.innerHTML=h;
  $('pClose').onclick=closePanel;
  el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{ G.buy(b.dataset.buy); renderPanel(); });
  el.querySelectorAll('[data-perk]').forEach(b=>b.onclick=()=>{ G.buyPerk(b.dataset.perk); renderPanel(); });
  el.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{ const v=b.dataset.val; S2.settings[b.dataset.set]=v==='true'?true:v==='false'?false:v; G.save(); if(b.dataset.set==='gray') setLUTs(); if(b.dataset.set==='sound'&&S2.settings.sound) G.unlockAudio(); renderPanel(); });
  if($('pDaily')) $('pDaily').onclick=()=>{ G.daily(); renderPanel(); };
  if($('pReb')) $('pReb').onclick=()=>{ G.rebirth(); closePanel(); };
  if($('pWipe')) $('pWipe').onclick=()=>{ if($('pWipe').dataset.sure){ G.reset(); } else { $('pWipe').dataset.sure=1; $('pWipe').textContent='Tap again to wipe everything'; } };
  if($('alGrid')) S2.alumni.slice().reverse().forEach(al=>{ const d=document.createElement('div'); d.className='al'; d.appendChild(face(al));
    const r=G.RARITY[al.rar]; const t=document.createElement('div');
    t.innerHTML=`<b>${esc(al.name)}</b><br><span class="dim">${esc(G.ARCH[al.arch].name.toLowerCase())}</span> · <span style="color:rgb(${r[3].join(',')})">${(al.shiny?'shiny ':'')+r[0].toLowerCase()}</span><br><span class="gold">${G.JOBS_ALUMNI[al.job][0].toLowerCase()}</span><br>now enjoys ${esc(al.enjoys.join(', '))}`;
    d.appendChild(t); $('alGrid').appendChild(d); });
}
window.__G=GAME;
boot();
